    const changed = JSON.stringify(merged) !== JSON.stringify(notesFromBody(j.body))
    notes = merged
    localStorage.setItem('plannerNotes', JSON.stringify(notes))
    drawNotes()
    if (changed && (notesDirty || true)) {
      const w = await fetch(url, {
        method:'PATCH',
        headers:{ 'Authorization':'Bearer ' + token(), 'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json' },
        body: JSON.stringify({ body: notesBody(notes) })
      })
      if (!w.ok) throw new Error('saving the notes issue: HTTP ' + w.status)
    }
    notesDirty = false
    noteSyncSays('saved to ' + NOTES_REPO + ' #' + num)
  } catch (e) {
    noteSyncSays(e.message + ' · kept in this browser', true)
    if (!quiet) toast('Notes: ' + e.message, 'err')
  } finally { notesBusy = false }
}

// the new-note row: type, repo and release are all optional, because a note that needs three
// decisions before it can be written is a card, and cards are what this is not
function fillNoteFields() {
  const keep = $('noteType').value
  $('noteType').innerHTML = NOTE_TYPES.map(t =>
    '<option value="' + (t === 'no type' ? '' : t) + '">' + t + '</option>').join('')
  $('noteType').value = keep
}

// GitHub's new-issue form takes title, body and milestone in the query string, so a note
// arrives as a first draft with the thinking already in it, and the house format pass happens
// on the card itself
function noteToCardUrl(n) {
  const repo = n.repo || NOTES_REPO
  const p = new URLSearchParams({ title: noteTitle(n) })
  const body = noteRest(n)
  if (body) p.set('body', body)
  if (n.ms) p.set('milestone', n.ms)
  return 'https://github.com/' + OWNER + '/' + repo + '/issues/new?' + p
}

// an idea archived under the old name keeps its old flag
const isArch = n => !!(n.archived || n.done)
// age from birth: an edit or a rename never resets it
const ideaAge = t => { const d = Math.floor((Date.now() - (t || Date.now())) / 864e5)
  return d < 1 ? 'today' : d < 14 ? d + 'd' : d < 61 ? Math.floor(d / 7) + 'w'
       : Math.floor(d / 30.44) + 'mo' }

function renameIdea(n) {
  const text = prompt('Idea', n.text)
  if (text == null) return
  n.text = text; n.updatedAt = Date.now(); saveNotes()
}

function noteEl(n) {
  const el = elem('div', 'note' + (isArch(n) ? ' done' : ''))
  const body = elem('div', 'body')
  const t = elem('div', 'title'); t.textContent = noteTitle(n) || '(empty idea)'
  body.appendChild(t)
  if (noteRest(n)) { const r = elem('div', 'rest'); r.textContent = noteRest(n); body.appendChild(r) }
  const meta = elem('div', 'meta')
  const chip = (text, cls) => { const c = elem('span', 'chip ' + (cls || '')); c.textContent = text
                                meta.appendChild(c); return c }
  if (n.type) chip(n.type)
  const when = n.ms ? cleanTitle(n.ms) : n.due ? 'exp ' + pretty(n.due) : 'unplanned'
  const wc = chip(when, n.ms || n.due ? 'pill upcoming' : '')
  if (n.due && !n.ms) wc.dataset.tip = 'expected release date'
  if (n.effort && n.impact) chip(QUAD_NAME[n.effort + n.impact])
  const age = chip(ideaAge(n.createdAt), 'pill closed')
  age.dataset.tip = 'here since ' + pretty(dayOf(n.createdAt || Date.now()))
    + '<br><i>a rename does not reset it</i>'
  body.appendChild(meta)

  const acts = elem('div', 'acts')
  const act = (glyph, tip, fn) => {
    const a = elem('span'); a.textContent = glyph; a.dataset.tip = tip; a.onclick = fn
    acts.appendChild(a)
  }
  if (!isArch(n)) {
    act('✎', 'Rename this idea', () => renameIdea(n))
    act('↗', 'Open a new GitHub issue with this idea in it',
      () => window.open(noteToCardUrl(n), '_blank', 'noopener'))
    act('🗄', 'Archive it', () => { n.archived = true; n.updatedAt = Date.now(); saveNotes() })
  } else {
    act('↺', 'Put it back on the pile', () => {
      n.archived = false; delete n.done; n.updatedAt = Date.now(); saveNotes() })
    act('🗑', 'Delete it for good', () => {
      if (!confirm('Delete this idea for good?\n\n' + noteTitle(n))) return
      n.deleted = true; n.text = ''; n.updatedAt = Date.now(); saveNotes()
    })
  }
  el.append(body, acts)
  return el
}

let archOpen = false
function drawNotes() {
  drawQuads()
  const live = liveNotes()
  const open = live.filter(n => !isArch(n))
  const arch = live.filter(isArch)
  $('noteCount').textContent = live.length
    ? open.length + ' open' + (arch.length ? ' \u00b7 ' + arch.length + ' archived' : '') : ''
  const box = $('noteList')
  box.textContent = ''
  for (const n of open) box.appendChild(noteEl(n))
  if (!open.length) {
    const p = elem('p', 'muted')
    p.textContent = 'Nothing yet. Anything you would otherwise forget by tomorrow goes here.'
    box.appendChild(p)
  }
  $('archBar').hidden = !arch.length
  $('archToggle').textContent = (archOpen ? 'Hide archived' : 'Archived') + ' (' + arch.length + ')'
  const ab = $('archList')
  ab.textContent = ''
  ab.hidden = !archOpen || !arch.length
  if (archOpen && arch.length) for (const n of arch) ab.appendChild(noteEl(n))
}

/* ---- priorities: the pile rated on two axes -----------------------------------------
   A note earns a place in one of four boxes: effort (fast or slow to build) by impact
   (high or low). The rating lives on the note itself, so it syncs with the pile and any
   browser sees the same board. Done and deleted notes leave the board on their own. */
const QUAD_NAME = { fasthigh:'Quick Wins', slowhigh:'Major Projects', fastlow:'Fill-Ins', slowlow:'Deprioritize' }

function qnoteEl(n) {
  const el = elem('div', 'qnote')
  el.draggable = true
  el.ondragstart = e => { e.dataTransfer.setData('text/plain', n.id)
                          e.dataTransfer.effectAllowed = 'move' }
  const pen = elem('span', 'acts'); pen.textContent = '\u270e'
  pen.dataset.tip = 'Rename this idea'
  pen.onclick = e => { e.stopPropagation(); renameIdea(n) }
  el.appendChild(pen)
  const t = elem('div', 'title'); t.textContent = noteTitle(n) || '(empty idea)'
  el.appendChild(t)
  const meta = elem('div', 'meta')
  const chip = text => { const c = elem('span', 'chip'); c.textContent = text; meta.appendChild(c) }
  if (n.type) chip(n.type)
  if (n.ms) chip(cleanTitle(n.ms))
  else if (n.due) chip('exp ' + pretty(n.due))
  if (meta.children.length) el.appendChild(meta)
  return el
}

function drawQuads() {
  if (!$('quadCard')) return
  const live = liveNotes().filter(n => !isArch(n))
  let unrated = 0
  for (const cell of document.querySelectorAll('.qcell, #qtray')) {
    const body = cell.querySelector('.qbody')
    body.textContent = ''
    const list = cell.id === 'qtray'
      ? live.filter(n => !(n.effort && n.impact))
      : live.filter(n => n.effort === cell.dataset.e && n.impact === cell.dataset.i)
    if (cell.id === 'qtray') unrated = list.length
    for (const n of list) body.appendChild(qnoteEl(n))
  }
  $('quadCount').textContent = live.length
    ? live.length + ' open' + (unrated ? ' \u00b7 ' + unrated + ' not rated' : '') : ''
}

function addNote() {
  const text = $('noteText').value.trim()
  if (!text) return $('noteText').focus()
  notes.unshift({ id: noteId(), text, type: $('noteType').value || '',
                  due: $('noteDue').value || '', done:false,
                  createdAt: Date.now(), updatedAt: Date.now() })
  ideaModal(false)
  saveNotes()
}

function ideaModal(open) {
  $('ideaModal').hidden = !open
  if (!open) return
  fillNoteFields()
  $('noteText').value = ''
  $('noteDue').value = ''       // a date picked for one idea must not stick to the next
  $('noteText').focus()
}

/* ---- toast ---- */
// textContent, never innerHTML: these carry repo names and raw GitHub messages
function toast(msg, kind) {
  let box = $('toasts')
  if (!box) { box = elem('div'); box.id = 'toasts'; document.body.appendChild(box) }
  const t = elem('div', 'toast ' + (kind || 'info'))
  t.textContent = msg
  const close = () => { t.classList.add('out'); setTimeout(() => t.remove(), 200) }
  t.onclick = close
  box.appendChild(t)
  // an error stays long enough to read and copy; a success gets out of the way
  setTimeout(close, kind === 'err' ? 12000 : 4000)
}

// A toast that does NOT time out: it spins until the thing it is reporting is really finished,
// and says what it is on now. Nothing else on the page shows that a write is still running.
function busyToast(msg) {
  let box = $('toasts')
  if (!box) { box = elem('div'); box.id = 'toasts'; document.body.appendChild(box) }
  const t = elem('div', 'toast busy')
  const line = elem('span')
  line.textContent = msg
  t.appendChild(line)
  box.appendChild(t)
  return {
    set: text => { line.textContent = text },
    done: () => { t.classList.add('out'); setTimeout(() => t.remove(), 200) }
  }
}

/* ---- drag the right edge of a bar to move the due date ---- */
let pending = null, renameTo = null, renameOn = false
const prettyDue = d => d ? pretty(d) : 'no due date'
const stampOf = d => d.replace(/-/g, '')

// milestone titles start with the due date, so a moved date leaves a title that lies.
// Offer the matching rename, but only when the title really carries the old date.
function paintRename() {
  const b = $('askRename')
  if (!renameTo) { b.style.display = 'none'; return }
  b.style.display = ''
  b.textContent = (renameOn ? '☑' : '☐') + ' rename to ' + renameTo.slice(0, 8)
  b.title = renameTo
}
$('askRename').onclick = () => { renameOn = !renameOn; paintRename() }

function askConfirm(r, newDue) {
  const targets = (r.refs || []).filter(f => !f.closed)   // never reschedule a closed milestone
  // Both of these used to just put the bar back and say nothing, which looked like the drag
  // had worked. Say what happened instead.
  if (!r.refs) { cancelAsk(true); return toast('This release was drawn from an old cached copy '
    + 'that has no milestone ids. Press Refresh, then drag again.', 'err') }
  if (!targets.length) { cancelAsk(true); return toast(r.name
    + ' is closed in every repo, so there is no open milestone to move.', 'err') }
  if (newDue === r.due) { cancelAsk(true)
    return toast('Dropped back on ' + pretty(newDue) + ', so nothing changed.', 'info') }
  renameTo = r.due && r.title.startsWith(stampOf(r.due))
    ? stampOf(newDue) + r.title.slice(8) : null
  renameOn = !!renameTo
  paintRename()
  pending = { due:newDue, targets, titleBefore:r.title }
  $('askText').innerHTML = 'Move <b>' + esc(r.name) + '</b> due date from ' + prettyDue(r.due)
    + ' to <b>' + pretty(newDue) + '</b>?'
  $('askRepos').textContent = 'changes ' + targets.map(t => t.repo + ' #' + t.number).join(', ')
  $('askGo').disabled = false
  $('askGo').textContent = 'Confirm'
  $('ask').classList.add('on')
}

// Same confirm bar as the due date drag, because this also throws work away, and it says
// where the ticks live: nothing on GitHub moves.
function askClearTicks() {
  if (!thisSprint.size) return
  renameTo = null; paintRename()
  pending = { ticks:true }
  const n = thisSprint.size
  $('askText').innerHTML = 'Untick <b>' + n + ' release' + (n > 1 ? 's' : '') + '</b> from This Sprint?'
  $('askRepos').textContent = 'only this browser, nothing on GitHub changes'
  $('askGo').disabled = false
  $('askGo').textContent = 'Confirm'
  $('ask').classList.add('on')
}

/* ---- closing a release, the way the PO milestone skill does it ----
   Close in every repo, then move the date stamp into the bracket: "20260814 Name" becomes
   "[Closed on 20260814] Name". The date is the one the title already carried, never the day
   the button was pressed. A card whose board Status is Done but whose issue is still open is
   bookkeeping and is closed first, with state_reason completed. A card in any other status is
   listed in the confirm bar instead: closing over it hides it from every release view, and
   that is a decision, not a default. */
function closedTitle(r) {
  const m = r.title.match(/^(\d{8})\s+(.*)$/)
  return m ? '[Closed on ' + m[1] + '] ' + m[2]
           : '[Closed on ' + stampOf(r.due) + '] ' + r.title
}

function askClose(r) {
  if (!r || r.state === 'closed') return
  if (r.cards.some(c => c.open === undefined)) {
    return toast('This row was loaded by an older copy of the page. Press Refresh, then close.', 'err')
  }
  const targets = (r.refs || []).filter(f => !f.closed)
  if (!targets.length) return toast(r.name + ' is already closed in every repo.', 'info')
  const notDone = r.cards.filter(c => c.status !== STATUS_DONE)
  const doneOpen = r.cards.filter(c => c.status === STATUS_DONE && c.open)
  renameTo = null; paintRename()
  pending = { close:true, row:r, targets, doneOpen }
  $('askText').innerHTML = 'Close <b>' + esc(r.name) + '</b> and rename it to '
    + esc(closedTitle(r).slice(0, 19) + ']') + '?'
  $('askRepos').innerHTML = 'closes ' + targets.map(t => t.repo + ' #' + t.number).join(', ')
    + (doneOpen.length ? ' · ' + doneOpen.length + ' Done card'
        + (doneOpen.length > 1 ? 's' : '') + ' still open on GitHub will be closed first' : '')
    + (notDone.length ? ' · <b class="late">' + notDone.length + ' card'
        + (notDone.length > 1 ? 's' : '') + ' not Done</b> ('
        + notDone.slice(0, 5).map(c => (REPO_SHORT[c.repo] || c.repo) + ' #' + c.number
            + ' ' + esc(STATUS_SHORT[c.status] || c.status)).join(', ')
        + (notDone.length > 5 ? ', +' + (notDone.length - 5) + ' more' : '')
        + '), closing hides them from every release view' : '')
  $('askGo').disabled = false
  $('askGo').textContent = 'Close release'
  $('ask').classList.add('on')
}

async function ghPatch(path, body, where) {
  let res
  try {
    res = await fetch('https://api.github.com/repos/' + OWNER + '/' + path, {
      method: 'PATCH',
      headers: { 'Authorization':'Bearer ' + token(), 'Accept':'application/vnd.github+json',
                 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    })
  } catch (e) { throw new Error(where + ': the request never reached GitHub (' + e.message + ')') }
  const j = await res.json().catch(() => ({}))
  if (res.status === 403 || res.status === 404) throw new Error(where + ': your sign-in cannot '
    + 'change this (HTTP ' + res.status + '). It needs write access, and SSO authorised for ' + OWNER + '.')
  if (!res.ok) throw new Error(where + ': HTTP ' + res.status + (j.message ? ' ' + j.message : ''))
  return j
}

async function closeRelease({ row, targets, doneOpen }) {
  const title = closedTitle(row)
  const spin = busyToast('Closing ' + row.name + '...')
  const won = []
  try {
    // bookkeeping first: a Done card whose issue never got closed
    for (let i = 0; i < doneOpen.length; i++) {
      const c = doneOpen[i]
      spin.set('Closing card ' + (REPO_SHORT[c.repo] || c.repo) + ' #' + c.number
        + ' \u00b7 ' + (i + 1) + ' of ' + doneOpen.length + '...')
      await ghPatch(c.repo + '/issues/' + c.number,
        { state:'closed', state_reason:'completed' }, c.repo + ' #' + c.number)
    }
    // then the milestone itself: closed and renamed in one write per repo, read back checked
    for (const t of targets) {
      const where = t.repo + ' #' + t.number
      spin.set('Closing ' + where + ' \u00b7 ' + (won.length + 1) + ' of ' + targets.length + '...')
      const j = await ghPatch(t.repo + '/milestones/' + t.number, { state:'closed', title }, where)
      if (j.state !== 'closed') throw new Error(where + ': GitHub answered but the milestone came back ' + j.state)
      if (j.title !== title) throw new Error(where + ': closed, but the title came back "' + j.title + '"')
      won.push(where)
    }
    localStorage.removeItem(CACHE)
    cancelAsk()
    spin.set('Closed in ' + won.join(', ') + ' \u00b7 reading it back from GitHub...')
    await load(true)
    spin.done()
    toast('Closed ' + row.name + ' \u00b7 ' + won.join(', ')
      + (doneOpen.length ? ' \u00b7 ' + doneOpen.length + ' card'
          + (doneOpen.length > 1 ? 's' : '') + ' closed on the way' : ''), 'ok')
  } catch (e) {
    spin.done()
    const msg = e.message + (won.length ? ' — already closed: ' + won.join(', ') : '')
    $('askText').innerHTML = '<span class="err">' + esc(msg) + '</span>'
    $('askGo').disabled = false
    $('askGo').textContent = 'Try again'
    toast(msg, 'err')
  }
}

function cancelAsk(redraw) {
  pending = null
  $('ask').classList.remove('on')
  // put the bar back where it was, after vis has finished its own drag handling
  if (redraw) setTimeout(() => drawTimeline(rowsCache), 0)
}

// GitHub GraphQL cannot write a milestone, so this uses the REST route instead
async function setDue(ref, due, title) {
  const at = ref.dueOn ? ref.dueOn.slice(10) : 'T12:00:00Z'     // keep the time of day already in use
  const body = { due_on: due + at }
  if (title) body.title = title
  const where = ref.repo + ' #' + ref.number
  let res
  try {
    res = await fetch('https://api.github.com/repos/' + OWNER + '/' + ref.repo
      + '/milestones/' + ref.number, {
      method: 'PATCH',
      headers: { 'Authorization':'Bearer ' + token(), 'Accept':'application/vnd.github+json',
                 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    })
  } catch (e) { throw new Error(where + ': the request never reached GitHub (' + e.message + ')') }

  const j = await res.json().catch(() => ({}))
  // GitHub answers 404, not 403, when a token may read a private repo but not write it, so
  // say what that really means instead of passing "Not Found" through
  if (res.status === 403 || res.status === 404) throw new Error(where + ': your sign-in cannot '
    + 'change this milestone (HTTP ' + res.status + '). It needs write access to ' + ref.repo
    + ', and SSO authorised for ' + OWNER + '.')
  if (!res.ok) throw new Error(where + ': HTTP ' + res.status
    + (j.message ? ' ' + j.message : '') + (j.errors ? ' ' + JSON.stringify(j.errors) : ''))

  // A 200 is not proof the value stuck. Read the milestone back out of the reply and check.
  // This is what turns a silent no-op into something you can see.
  const got = (j.due_on || '').slice(0, 10)
  if (got !== due) throw new Error(where + ': GitHub accepted the change but the due date came '
    + 'back as ' + (got || 'empty') + ', not ' + due)
  if (title && j.title !== title) throw new Error(where + ': the due date moved but the title '
    + 'came back as "' + j.title + '", not "' + title + '"')
  return where
}

$('askNo').onclick = () => cancelAsk(true)
$('askGo').onclick = async () => {
  if (!pending) return
  if (pending.ticks) { cancelAsk(); clearTicks(); return }
  if (pending.close) { $('askGo').disabled = true; $('askGo').textContent = 'Closing...'
                       closeRelease(pending); return }
  const { due, targets, titleBefore } = pending
  const title = renameOn ? renameTo : null
  const finalTitle = title || titleBefore
  $('askGo').disabled = true
  $('askGo').textContent = 'Saving...'
  const won = []
  // one spinner for the whole job: every repo, then the reload that proves it landed
  const spin = busyToast('Moving ' + pretty(due) + ' into ' + targets.length + ' repo'
    + (targets.length > 1 ? 's' : '') + '...')
  try {
    for (const t of targets) {                 // one at a time, so a failure names the repo
      spin.set('Saving ' + t.repo + ' #' + t.number + ' \u00b7 ' + (won.length + 1)
        + ' of ' + targets.length + '...')
      won.push(await setDue(t, due, title))
    }
    localStorage.removeItem(CACHE)     // a refresh must never trust the old dates again
    cancelAsk()
    spin.set('Saved in ' + won.join(', ') + ' \u00b7 reading it back from GitHub...')
    await load(true)                   // straight from GitHub, the cache is gone by now
    spin.done()

    // Close the loop. The write is confirmed and the data is freshly fetched, so if the page
    // still shows the old date something between the two is wrong and it must be said out
    // loud rather than looking like the drag quietly did nothing.
    const row = rowsCache.find(r => r.title === finalTitle)
    if (!row) {
      toast('Saved on GitHub (' + won.join(', ') + '), but that release is not in the loaded '
        + 'window any more, so it is not on screen.', 'info')
    } else if (row.due !== due) {
      toast('GitHub stored ' + pretty(due) + ', but the reloaded page shows ' + pretty(row.due)
        + '. Another repo carrying the same milestone name is still on the older date.', 'err')
    } else {
      toast('Due date moved to ' + pretty(due) + ' · ' + won.join(', ')
        + (title ? ' · renamed to ' + title.slice(0, 8) : ''), 'ok')
    }
  } catch (e) {
    spin.done()
    // a partial write is the dangerous case: say which repos already changed
    const msg = e.message + (won.length ? ' — already changed: ' + won.join(', ') : '')
    $('askText').innerHTML = '<span class="err">' + esc(msg) + '</span>'
    $('askGo').disabled = false
    $('askGo').textContent = 'Try again'
    toast(msg, 'err')
  }
}

/* ---- mermaid export, kept for pasting into a GitHub issue ---- */
const GANTT_KEYWORDS = /^(call|click|href|title|section|gantt|dateformat|axisformat|tickinterval|excludes|includes|todaymarker|inclusiveenddates|topaxis|weekday|weekend|acctitle|accdescr)\b/i
function mermaidLabel(name) {
  const t = name.replace(/[:,#;]/g, '').replace(/%%/g, '%').trim()
  return GANTT_KEYWORDS.test(t) ? '• ' + t : t
}
const TAG = { running:'', upcoming:'active', closed:'done', slipped:'crit' }
function toMermaid(rows) {
  const shown = rows.filter(inWindow)
  const theme = { taskBkgColor:'#3b82f6', taskBorderColor:'#1d4ed8',
    activeTaskBkgColor:'#5eead4', activeTaskBorderColor:'#0d9488',
    doneTaskBkgColor:'#d1d5db', doneTaskBorderColor:'#9ca3af',
    critBkgColor:'#f59e0b', critBorderColor:'#b45309', todayLineColor:'#d33' }
  const lines = ['```mermaid',
    '%%{init: {"themeVariables": ' + JSON.stringify(theme) + '}}%%', 'gantt',
    '    title Release Planner', '    dateFormat YYYY-MM-DD', '    axisFormat %-d %b',
    '    tickInterval 1week', '    weekday monday',
    '    todayMarker stroke-width:3px,stroke:#d33,opacity:0.9', '']
  let section = null
  for (const r of shown) {
    if (r.end !== section) { section = r.end; lines.push('    section ' + pretty(r.end)) }
    const tag = TAG[r.state]
    const span = r.start >= r.end ? r.end + ', 1d' : r.start + ', ' + r.end
    lines.push('    ' + mermaidLabel(r.name) + ' ' + r.done + '/' + r.total
               + ' :' + (tag ? tag + ', ' : '') + span)
  }
  lines.push('```')
  return lines.join('\n')
}

/* ---- ratio bars ---- */
// Off: every bar is as wide as the release has cards, so a big release looks big next to a
// small one. On: every bar fills the column, which compares the mix and hides the size.
let full = localStorage.getItem('fullBars') === '1'
let maxCards = 1, maxKind = 1     // biggest release, and biggest single Story+Task / Bug+Defect group
const widthOf = base => full ? base + 'px'
  : Math.max(16, Math.round(base * scaleRow / maxCards)) + 'px'
let scaleRow = 1                       // the card count of the row being drawn right now

const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h }
function peopleBar(list) {
  if (!list.length) return '<span class="muted">-</span>'
  const total = list.reduce((s, p) => s + p.n, 0)
  return '<span class="ratio" style="width:' + widthOf(120) + '">' + list.map(p => {
    const w = p.n / total * 100
    const tip = '<img src="' + esc(p.avatar) + '&s=32">' + esc(p.login)
      + ' &middot; ' + p.n + ' cards &middot; ' + Math.round(w) + '%'
    return '<span class="seg" style="width:' + w.toFixed(2) + '%;background:hsl(' + hue(p.login) + ',65%,88%)"'
      + ' data-tip="' + esc(tip) + '">'
      + '<img class="face" src="' + esc(p.avatar) + '&s=48" alt="' + esc(p.login) + '"></span>'
  }).join('') + '</span>'
}
// One block per card so the count is readable by eye. Off the 100% toggle the bar is as wide
// as the cards it holds; on it, the blocks share the column but keep their separators.
const BUILD_TYPES = ['Story', 'Task', 'no type']
const FIX_TYPES   = ['Bug', 'Defect']
// which repos the cards in this column sit in, as a small pie
function repoPie(list, what) {
  if (!list.length) return '<span class="pie empty"></span>'
  const counts = {}
  for (const c of list) counts[c.repo] = (counts[c.repo] || 0) + 1
  const parts = Object.entries(counts).sort((a, b) => b[1] - a[1])
  let acc = 0
  // a thin white wedge between slices, so two neighbours never blur into one shape
  const gap = parts.length > 1 ? 1.6 : 0
  const stops = parts.map(([k, n]) => {
    const from = acc / list.length * 360
    acc += n
    const to = acc / list.length * 360
    const col = REPO_COLOR[k] || '#8b949e'
    return col + ' ' + from.toFixed(2) + 'deg ' + Math.max(from, to - gap).toFixed(2) + 'deg,'
      + '#fff ' + Math.max(from, to - gap).toFixed(2) + 'deg ' + to.toFixed(2) + 'deg'
  }).join(',')
  const tip = '<b>' + esc(what) + ' &middot; ' + list.length + ' cards</b><br>'
    + parts.map(([k, n]) => '<i class="dot" style="background:' + (REPO_COLOR[k] || '#8b949e') + '"></i>'
        + esc(REPO_SHORT[k] || k) + ' &middot; ' + n + ' &middot; '
        + Math.round(n / list.length * 100) + '%').join('<br>')
  return '<span class="pie" style="background:conic-gradient(' + stops + ')"'
    + ' data-tip="' + esc(tip) + '"></span>'
}

function cardBlocks(r, kinds, what) {
  const list = r.cards.filter(c => kinds.includes(c.type))
    .sort((a, b) => kinds.indexOf(a.type) - kinds.indexOf(b.type) || a.number - b.number)
  const base = 150
  const w = full ? base : Math.max(6, Math.round(base * list.length / Math.max(1, maxKind)))
  const counts = {}
  for (const c of list) counts[c.type] = (counts[c.type] || 0) + 1
  const head = Object.entries(counts).map(([t, n]) => n + ' ' + esc(t)).join(' &middot; ')
  const hashit = searchQ && list.some(matchCard)
  const bar = !list.length ? '<span class="cards none" style="width:' + w + 'px"></span>'
    : '<span class="cards' + (hashit ? ' hashit' : '') + '" style="width:' + w + 'px">' + list.map(c => {
        const tip = '<b>' + head + '</b><br>' + cardTip(c)
        return '<i class="' + (c.type === 'no type' ? 'notype' : '') + (matchCard(c) ? ' hit' : '')
          + '" style="background:'
          + (TYPE_COLOR[c.type] || TYPE_COLOR['no type']) + '" data-tip="' + esc(tip)
          + '" data-issue="' + esc(issueUrl(c)) + '"></i>'
      }).join('') + '</span>'
  return '<span class="cellrow">' + repoPie(list, what) + bar + '</span>'
}
function progressCell(r) {
  const behind = r.timePct > r.cardPct + 10 && r.state !== 'closed'
  // top bar: every card, Done first so the bar fills from the left as work lands
  const segs = DONE_FIRST.filter(b => r.statuses[b.s]).map(b => {
    const n = r.statuses[b.s], w = n / r.total * 100
    const tip = '<b>' + esc(b.short) + '</b> &middot; ' + n + ' card' + (n > 1 ? 's' : '')
      + ' &middot; ' + Math.round(w) + '%'
    return '<i style="width:' + w.toFixed(2) + '%;background:' + b.c + '" data-tip="' + esc(tip) + '"></i>'
  }).join('')
  const timeTip = '<b>Time</b> ' + Math.round(r.timePct) + '% gone &middot; '
    + pretty(r.start) + ' to ' + pretty(r.due)
    + (behind ? '<br>time is ahead of the cards' : '')
  return '<div class="prog" style="width:' + widthOf(210) + '">'
    + '<span class="pbar">' + segs + '</span>'
    + '<span class="pbar" data-tip="' + esc(timeTip) + '">'
    +   '<i class="time' + (behind ? ' behind' : '') + '" style="width:' + r.timePct.toFixed(1) + '%"></i></span>'
    + '</div>'
}

/* ---- table ---- */
// say why a release is in the state it is, so the rule never has to be taken on trust
function stateWhy(r) {
  const left = r.total - r.done
  if (r.state === 'closed') return '<b>closed</b><br>'
    + (r.late ? 'finished ' + pretty(r.lastDone) + ', after the ' + pretty(r.due) + ' due date'
              : 'finished on time')
  if (r.state === 'slipped') return '<b>slipped</b><br>due ' + pretty(r.due) + ' passed '
    + r.overdueBy + ' day' + (r.overdueBy > 1 ? 's' : '') + ' ago<br>'
    + left + ' card' + (left > 1 ? 's' : '') + ' still not Done'
  if (r.state === 'upcoming') return '<b>upcoming</b><br>no card has left To Do yet'
  return '<b>in progress</b><br>' + left + ' card' + (left > 1 ? 's' : '') + ' left'
    + ', due ' + pretty(r.due)
}

// start → due on one line, with the real finish only called out when it ran past the due date
function datesCell(r) {
  const late = r.late && r.lastDone
  return '<span class="dates">' + pretty(r.start)
    + (r.startedAt ? '' : '<span class="muted">*</span>')
    + ' <span class="muted">&rarr;</span> ' + pretty(r.due)
    + (late ? ' <b class="late">done ' + pretty(r.lastDone) + '</b>' : '') + '</span>'
}
const COLS = [
  { k:'sprint', h:'This Sprint',
    cell:r => r.state === 'closed' ? ''
      : '<span class="tick' + (r.inSprint ? ' on' : '') + '" data-t="' + esc(r.name)
      + '" role="checkbox" tabindex="0" aria-checked="' + !!r.inSprint + '" data-tip="'
      + esc(tickTip(r)) + '">'
      + (r.inSprint ? '☑' : '☐') + '</span>',
    val:r => r.state === 'closed' ? 2 : r.inSprint ? 0 : 1 },
  { k:'name',  h:'Milestone', cell:r => (() => {
      return ''
    })()
      + '<span class="rel copy-name" data-t="' + esc(r.title)
      + '" data-tip="Click to copy the milestone name">' + esc(r.name) + '</span>'
      + (r.state === 'closed' ? ''
          : '<span class="gopen gclose" data-t="' + esc(r.title)
            + '" data-tip="Close this release on GitHub, in every repo">🏁</span>')
      + '<a class="gopen" target="_blank" rel="noopener" title="Open the board filtered to this milestone" href="'
      + PROJECT_SLICE + encodeURIComponent(r.title) + '">↗</a>',
    val:r => r.name.toLowerCase() },
  { k:'state', h:'State',
    cell:r => '<span class="pill ' + r.state + '" data-tip="' + esc(stateWhy(r)) + '">'
      + STATE_LABEL[r.state] + '</span>',
    val:r => r.state },
  { k:'prog',  h:'Progress', cell:progressCell, val:r => r.cardPct - r.timePct },
  { k:'build', h:'Story & Task', cell:r => cardBlocks(r, BUILD_TYPES, 'Story & Task'),
    val:r => r.cards.filter(c => BUILD_TYPES.includes(c.type)).length },
  { k:'fix',   h:'Bug & Defect', cell:r => cardBlocks(r, FIX_TYPES, 'Bug & Defect'),
    val:r => r.cards.filter(c => FIX_TYPES.includes(c.type)).length },
  { k:'devs',  h:'Devs',     cell:r => peopleBar(r.devs), val:r => r.devs.length },
  { k:'qas',   h:'QAs',      cell:r => peopleBar(r.qas),  val:r => r.qas.length },
  { k:'dates', h:'Start &rarr; Due', cell:datesCell, val:r => r.due }
]
let rowsCache = [], sortKey = 'dates', sortDir = 1
let hideClosed = localStorage.getItem('hideClosed') === '1'

function drawTable() {
  const col = COLS.find(c => c.k === sortKey) || COLS[0]
  const q = searchQ
  const base = rowsCache.filter(inWindow).filter(r => !hideClosed || r.state !== 'closed')
  const kept = base.filter(rowMatch)
  const hits = q ? kept.reduce((n, r) => n + r.cards.filter(matchCard).length, 0) : 0
  $('searchCount').textContent = q
    ? kept.length + ' of ' + base.length + (hits ? ' · ' + hits + ' card' + (hits > 1 ? 's' : '') : '')
    : ''
  const sorted = kept.sort((a, b) => {
    const x = col.val(a), y = col.val(b)
    return (x < y ? -1 : x > y ? 1 : 0) * sortDir
  })
  const win = rowsCache.filter(inWindow)
  maxCards = Math.max(1, ...win.map(r => r.total))
  // both columns share one scale, so 8 blocks means the same width in either of them
  maxKind = Math.max(1, ...win.flatMap(r => [
    r.cards.filter(c => BUILD_TYPES.includes(c.type)).length,
    r.cards.filter(c => FIX_TYPES.includes(c.type)).length]))
  const head = '<tr>' + COLS.map(c =>
    '<th data-k="' + c.k + '" class="' + (c.k === sortKey ? 'sorted' : '') + '">' + c.h
    + ' <span class="arrow">' + (c.k === sortKey ? (sortDir > 0 ? '&#9650;' : '&#9660;') : '&#9670;')
    + '</span></th>').join('') + '</tr>'
  const body = sorted.map(r => {
    scaleRow = r.total                     // every bar in this row is sized by its card count
    return '<tr class="' + (r.state === 'closed' ? 'closed' : r.inSprint ? 'insprint' : '') + '">'
      + COLS.map(c => '<td class="col-' + c.k + '">' + c.cell(r) + '</td>').join('')
      + '</tr>'
  }).join('')
  $('table').innerHTML = head + body
  $('table').querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k
    if (k === sortKey) sortDir = -sortDir; else { sortKey = k; sortDir = 1 }
    drawTable()
  })
  $('table').querySelectorAll('.copy-name').forEach(el => {
    el.onclick = () => copyTitle(el.dataset.t)
  })
  $('table').querySelectorAll('.gclose').forEach(el => {
    el.onclick = () => askClose(rowsCache.find(r => r.title === el.dataset.t))
  })
  $('table').querySelectorAll('.tick').forEach(el => {
    el.onclick = () => toggleSprint(el.dataset.t)
    el.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); el.click() } }
  })
}

// Fixed widths, not random ones: the placeholder must not jitter between frames, and a
// re-render has to land in the same place. Cell sizes are driven off COLS, so a new column
// gets a placeholder without anyone remembering to add one.
const SK_BAR = [[6,54],[22,38],[2,71],[35,44],[14,60],[41,29],[9,66],[27,49],[17,57],[3,74]]
const SK_CELL = { sprint:[14,14], name:[180,9], state:[64,16], prog:[196,20], build:[132,17],
                  fix:[104,17], devs:[104,17], qas:[68,17], dates:[124,9] }
function skeleton(n = 10) {
  const rows = SK_BAR.slice(0, n).map(([off, w]) =>
    '<div class="sk-row"><span class="sk-lab"><span class="sk" style="width:'
    + (60 + (w % 35)) + '%;height:9px"></span></span>'
    + '<span class="sk-track"><span class="sk" style="margin-left:' + off + '%;width:' + w
    + '%;height:17px"></span></span></div>').join('')
  $('tl').innerHTML = '<div aria-hidden="true"><div class="sk-axis"></div>' + rows + '</div>'

  const cells = COLS.map(c => {
    const [w, h] = SK_CELL[c.k] || [90, 12]
    return '<td class="col-' + c.k + '"><span class="sk" style="width:' + w + 'px;height:' + h
      + 'px' + (h > 14 ? ';border-radius:9999px' : '') + '"></span></td>'
  }).join('')
  const head = '<tr>' + COLS.map(c => '<th>' + c.h + '</th>').join('') + '</tr>'
  $('table').innerHTML = head + ('<tr>' + cells + '</tr>').repeat(n)
  $('table').setAttribute('aria-busy', 'true')
}

// Called wherever GitHub answers, not only on a full paint: one Refresh is 10 or so queries
// and the bar is the only place the cost of them shows.
const BUDGET = 5000
function paintQuota() {
  const q = $('quota')
  if (!rate) { q.hidden = true; return }
  const left = Math.max(0, Math.min(100, rate.remaining / BUDGET * 100))
  q.hidden = false
  q.className = 'quota' + (left < 10 ? ' low' : left < 25 ? ' mid' : '')
  q.innerHTML = '<span class="qbar"><i style="width:' + left.toFixed(1) + '%"></i></span>'
    + '<span>' + rate.remaining + '</span>'
  q.dataset.tip = 'GitHub API budget &middot; ' + rate.remaining + ' of ' + BUDGET + ' left this hour'
    + (rate.resetAt ? '<br>full again at ' + clock(+new Date(rate.resetAt)) + ' Bangkok' : '')
}

/* ---- load ---- */
// The built rows are kept in this browser so a reload, or a second tab, paints at once and
// spends nothing. Only a stale cache, the Refresh button or Show older costs API budget.
const CACHE = 'roadmapRows'
function saveCache() {
  try { localStorage.setItem(CACHE, JSON.stringify({ at:Date.now(), closedMs, rows:rowsCache })) }
  catch (e) { /* browser storage full, the page still works */ }
}
function readCache() {
  try { return JSON.parse(localStorage.getItem(CACHE) || 'null') } catch (e) { return null }
}

function paint(when) {
  $('table').removeAttribute('aria-busy')
  applyPlan(rowsCache)          // planned starts depend on the sprint, not on the fetch
  fillNoteFields()              // the release picker can only list releases once they are built
  drawTable()
  // The chart is the half that can fail on its own: it is the only part with a library under
  // it. A throw in here used to leave an empty white box and take the rest of the paint with
  // it, which reads as "still loading" for ever. Say what happened, and let the next paint
  // build a fresh Timeline rather than reusing a half built one.
  try {
    drawTimeline(rowsCache)
  } catch (e) {
    timeline = null
    // the library comes off a CDN, so its absence is the one failure worth naming outright
    const why = typeof vis === 'undefined'
      ? 'the timeline library did not load, so nothing can draw the chart'
      : esc(e.message) + esc(String(e.stack || '').split('\n')[1] || '')
    $('tl').innerHTML = '<p class="err" style="padding:16px">The chart could not be drawn: ' + why
      + '<br>The table below is the same data. Press Refresh to try again.</p>'
    toast('The chart could not be drawn: ' + e.message, 'err')
  }
  const shown = rowsCache.filter(inWindow)
  const n = s => shown.filter(r => r.state === s).length
  const devs = new Set(shown.flatMap(r => r.devs.map(p => p.login))).size
  const qas  = new Set(shown.flatMap(r => r.qas.map(p => p.login))).size
  // short line; the detail lives on hover. Warnings stay visible: silence would read as complete.
  $('stamp').textContent = clock(when)
    + ' · ' + shown.length + ' releases'
    + (n('slipped') ? ' · ' + n('slipped') + ' slipped' : '')
    + (truncated.length ? ' · card count is short on ' + truncated.join(', ') : '')
    + (capped.length ? ' · more releases exist behind ' + capped.join(', ') + ', press Older' : '')
  $('stamp').dataset.tip = 'updated ' + clock(when) + ' Bangkok (GMT+7)'
    // which build of the PAGE this is, off the Last-Modified header GitHub Pages serves it
    // with, so a stale cached copy can be recognised without guessing
    + '<br>page from ' + new Date(document.lastModified).toLocaleString('en-GB',
        { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', timeZone:TZ }) + ' Bangkok'
    + '<br>' + devs + ' devs &middot; ' + qas + ' QAs'
    + (rate ? '<br>API budget ' + rate.remaining + '/5000' : '')
    + (me ? '<br>signed in as @' + me : '')
  if (me) $('signout').title = 'Signed in as @' + me
}

let loading = false
async function load(force) {
  if (!token()) {
    gateOn()
    $('signout').hidden = true
    $('tl').textContent = ''; $('table').innerHTML = ''
    return
  }
  gateOff()
  $('signout').hidden = false
  const cached = readCache()
  if (!force && cached && cached.closedMs >= closedMs && Date.now() - cached.at < REFRESH_MS) {
    rowsCache = cached.rows
    paint(cached.at)
    syncNotes(true)
    return
  }
  if (loading) return
  loading = true
  // only when there is nothing on screen: replacing a live chart with a placeholder is worse
  // than letting the old numbers stand for a few seconds while the new ones arrive
  if (!rowsCache.length) skeleton()
  try {
    truncated = []; capped = []
    const all = (await Promise.all(REPOS.map(fetchRepo))).flat()
    rowsCache = build(all)
    saveCache()
    paint(Date.now())
    syncNotes(true)
  } catch (e) {
    if (cached) {                              // keep the old picture rather than an empty page
      rowsCache = cached.rows
      paint(cached.at)
      $('stamp').innerHTML += ' · <span class="err">' + esc(e.message) + '</span>'
    } else {
      $('tl').innerHTML = '<p class="err" style="padding:16px">' + esc(e.message) + '</p>'
      $('table').innerHTML = ''                  // clear the skeleton, it would look like data
      $('table').removeAttribute('aria-busy')
    }
    if (/rejected|access/i.test(e.message)) { gateOn(); $('gateErr').textContent = e.message }
  } finally { loading = false }
}

  document.querySelectorAll('.tabQ').forEach(el => el.hidden = !quad)
  $('tabRel').classList.toggle('on', !quad)
  $('tabQuad').classList.toggle('on', quad)
  if (quad) drawQuads()
  // vis sizes itself against a hidden box as zero, so coming back needs a redraw
  else if (timeline) timeline.redraw()
}
$('tabRel').onclick = () => showTab(false)
$('archToggle').onclick = () => { archOpen = !archOpen; drawNotes() }
$('archClear').onclick = () => {
  const arch = liveNotes().filter(isArch)
  if (!arch.length) return
  if (!confirm('Delete ' + arch.length + ' archived idea' + (arch.length > 1 ? 's' : '')
    + ' for good?')) return
  for (const n of arch) { n.deleted = true; n.text = ''; n.updatedAt = Date.now() }
  saveNotes()
}
$('tabQuad').onclick = () => showTab(true)
for (const cell of document.querySelectorAll('.qcell, #qtray')) {
  cell.ondragover = e => { e.preventDefault(); cell.classList.add('over') }
  cell.ondragleave = () => cell.classList.remove('over')
  cell.ondrop = e => {
    e.preventDefault()
    cell.classList.remove('over')
    const n = notes.find(x => x.id === e.dataTransfer.getData('text/plain'))
    if (!n) return
    if (cell.id === 'qtray') { delete n.effort; delete n.impact }
    else { n.effort = cell.dataset.e; n.impact = cell.dataset.i }
    n.updatedAt = Date.now()
    saveNotes()
  }
}
// ctrl/cmd+enter adds, so a note never needs the mouse
$('noteText').onkeydown = e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); addNote() }
}
fillNoteFields()
drawNotes()

$('signin').onclick = signIn
// the table repaints on every keystroke; the chart is heavier, so it follows 150ms behind
let searchTimer = null
$('search').oninput = () => {
  searchQ = ($('search').value || '').trim().toLowerCase()
  drawTable()
  clearTimeout(searchTimer)
  searchTimer = setTimeout(() => drawTimeline(rowsCache), 150)
}
$('refresh').onclick = async () => {
  const b = $('refresh')
  b.disabled = true
  b.textContent = 'Refreshing...'
  try { await load(true) } finally { b.disabled = false; b.textContent = 'Refresh' }
}
$('signout').onclick = signOut
// only refresh while the tab is actually being looked at, so a forgotten tab costs nothing
setInterval(() => { if (!document.hidden) load(true) }, REFRESH_MS)

if (!CONFIGURED) {
  gateOn()
  $('signin').disabled = true
  $('gateErr').textContent = 'This copy of the page has no CLIENT_ID or EXCHANGE set, so there is '
    + 'nothing to sign in to. See auth/README.md in the repo.'
} else {
  // a return from GitHub carries ?code=, and that has to be spent before anything asks for data
  finishSignIn().then(handled => { if (!handled || token()) load() })
}
</script>
</body>
</html>

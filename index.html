<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Planner</title>
<!-- Favicon is inline so the page stays one file and costs no extra request: three gantt
     bars in ingfah teal, the shortest one Done-green, on the white canvas the page uses.
     Hairline border so the tile still has an edge on a light browser tab. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='.75' y='.75' width='30.5' height='30.5' rx='6.5' fill='%23ffffff' stroke='%23dddddd' stroke-width='1.5'/%3E%3Crect x='5' y='8' width='19' height='4.5' rx='2.25' fill='%2300BBA7'/%3E%3Crect x='9' y='15' width='18' height='4.5' rx='2.25' fill='%2300BBA7' opacity='.5'/%3E%3Crect x='5' y='22' width='11' height='4.5' rx='2.25' fill='%234ac26b'/%3E%3C/svg%3E">
<meta name="theme-color" content="#00BBA7">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* Chrome tokens come from DESIGN.md (Airtable system) in this repo:
     white canvas, near-black ink, hairline borders, modest type weights,
     radius scale 12/10/6/2, spacing on a 4px grid.
     Status, card type and repo colours are DATA colours synced with the
     GitHub board — they are owned by the JS constants, not by this file. */
  :root { --canvas:#ffffff; --ink:#181d26; --ink-active:#0d1218; --body:#333840;
          --muted:#41454d; --soft-muted:#9297a0; --hairline:#dddddd;
          --surface-soft:#f8fafc; --cream:#f5e9d4; --link:#1b61c9; --link-active:#1a3866;
          --focus:#458fff;
          --card:var(--canvas); --line:var(--hairline); --late:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; padding:32px; background:var(--canvas); color:var(--body);
         font:14px/1.4 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
              "Helvetica Neue",sans-serif; }
  header { display:flex; align-items:baseline; gap:8px 16px; flex-wrap:wrap; margin-bottom:24px; }
  h1 { font-size:24px; font-weight:500; color:var(--ink); margin:0; letter-spacing:.12px; }
  .muted { color:var(--muted); font-size:12px; }
  .card { background:var(--card); border:1px solid var(--hairline); border-radius:12px;
          padding:16px; margin-bottom:24px; }
  .card.flush { padding:0; overflow:hidden; }
  .bar { display:flex; align-items:center; gap:12px; padding:12px 16px;
         border-bottom:1px solid var(--hairline); flex-wrap:wrap; row-gap:8px; }
  button { font:inherit; font-weight:500; color:var(--ink); padding:6px 12px;
           border:1px solid var(--hairline); border-radius:12px;
           background:var(--canvas); cursor:pointer; }
  button:hover { background:var(--surface-soft); }
  button.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
  button.primary:hover { background:var(--ink-active); }
  input { font:inherit; color:var(--ink); padding:8px 12px; border:1px solid var(--hairline);
          border-radius:6px; width:340px; background:var(--canvas); }
  input:focus { outline:2px solid var(--focus); outline-offset:-1px; }
  input.dmy { width:132px; padding-left:8px; padding-right:8px;
              font-variant-numeric:tabular-nums; text-align:center; }
  input.bad { outline:2px solid #cf222e; outline-offset:-1px; }
  /* state pills */
  .pill { display:inline-block; padding:2px 10px; border-radius:9999px; font-size:11px;
          font-weight:500; letter-spacing:.1px; white-space:nowrap; }
  .pill.running  { background:#ddf4ff; color:#0a5dc2; }
  .pill.slipped  { background:#fff1e5; color:#bc4c00; }
  .pill.upcoming { background:#fff8c5; color:#7d4e00; }
  .pill.closed   { background:#eaeef2; color:#57606a; }
  /* the tooltip's status pill: a line and its colour, tighter than the state pills */
  .pill.outline { background:none; border:1px solid; padding:0 6px; font-size:10px; }
  .key { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);
         white-space:nowrap; }
  .key i { width:11px; height:11px; border-radius:3px; display:block; flex:0 0 auto; }
  /* the chips are joined with no whitespace between them, so the gap has to come from here */
  .keys { display:inline-flex; align-items:center; flex-wrap:wrap; gap:8px 16px; }
  .key i.ul { height:4px; width:14px; border-radius:2px; }
  /* quiet hover chips: the legend and the how-to live in a tooltip, not in the toolbar */
  .chip { font-size:12px; color:var(--muted); border:1px solid var(--hairline); border-radius:12px;
          padding:3px 10px; cursor:default; }
  .chip:hover { color:var(--ink); background:var(--surface-soft); }
  #tip .keys { display:grid; gap:6px; }
  #tip .key { color:#fff; }
  #tip .key.head { color:#c3c8cf; margin-top:4px; }
  .sep { flex:1 }

  /* ---- timeline ---- */
  #tl { border:0; user-select:none; }
  /* vis gives each day label the full column width, so centering the text puts the number in
     the middle of its cell instead of hanging off the grid line: | 1 | 2 | 3 | */
  /* Two lines in the height vis measured for one: the weekday and the number both run at
     line-height 1 with no padding, so together they still fit the single line box. */
  .vis-time-axis .vis-text.vis-minor { text-align:center; padding:0; line-height:1;
            font-size:11px; }
  .vis-time-axis .vis-text.vis-minor .dow { display:block; font-size:7.5px; line-height:1;
            padding:1px 0; letter-spacing:.3px; color:var(--soft-muted); }
  /* vis sizes the axis row off this hidden probe, so the probe must be two lines tall too */
  .vis-time-axis .vis-text.vis-minor.vis-measure { height:22px; }
  .vis-timeline { border:0; font-family:inherit; font-size:12px; }
  .vis-item { border-width:1px; border-radius:6px; color:var(--ink); background:var(--canvas);
              border-color:#c3c8cf; }
  /* vis shoves item content right with an inline left when a bar crosses the window
     edge. fitBars() owns that job now, and two movers doubled the shift. */
  .vis-item .vis-item-content { padding:0; width:100%; left:0 !important; }
  .vis-item.st-slipped { border-color:#e16f24; border-width:2px; }
  .vis-item.st-closed  { background:#f0f2f5; border-color:#d8dee4; }
  /* a dashed edge says the start date is a plan, not something that has happened */
  .vis-item.planned { border-style:dashed; }
  /* This sprint: the ticked bars stay exactly as they are and everything else steps back.
     Finding what is NOT faded is faster than picking a lit edge out of a wall of bars, and it
     costs the ticked rows none of their own colour. The weekend and holiday bands keep their
     weight, or the calendar you are counting days against would fade out with the bars. */
  #tl.sprint-focus .vis-item:not(.vis-background):not(.in-sprint) { opacity:.4; }
  /* search: hits ring in violet, everything else steps back the way the sprint fade does.
     Violet sits outside every status and type colour, so a ring can only mean a search hit. */
  #tl.search-focus .vis-item:not(.vis-background):not(.has-hit) { opacity:.25; }
  .blocks.hashit i:not(.hit), .cards.hashit i:not(.hit) { opacity:.3; }
  .blocks i.hit, .cards i.hit { outline:2px solid #8250df; outline-offset:-1px;
            position:relative; z-index:1; }
  .tick { cursor:pointer; user-select:none; font-size:15px; line-height:1; color:var(--soft-muted);
          padding:2px 4px; border-radius:6px; display:inline-block; }
  .tick:hover { color:var(--ink); background:var(--surface-soft); }
  .tick.on { color:#009181; }
  .tick:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
  /* the same tick in the chart's name column, sized down to the 12px label row */
  .gtick { flex:0 0 auto; font-size:13px; padding:1px 2px; }
  /* a closed release holds the column open so the names stay in line */
  .gtick.ghost { visibility:hidden; }
  .glab .pill { padding:1px 7px; font-size:10px; }

  /* one equal block per card: fill = card type, stripe underneath = repo */
  /* 19px block with a 2px item margin is the same 23px row as a 17px block with 3px */
  .blocks { display:flex; height:19px; width:100%; align-items:stretch; }
  .blocks i { flex:1 1 0; min-width:2px; box-sizing:border-box;
              border-right:1px solid rgba(255,255,255,.9); border-bottom:3px solid transparent; }
  .blocks i:last-child { border-right:0; }
  /* zoomed far out, a bar is narrower than cards x 2px, and the overflow clipped on the
     right read as missing cards. Dense mode drops the floor and the seams: every card
     stays inside the bar and the strip reads as proportion, like the table's bar. */
  .blocks.dense i { min-width:0; border-right:0; }
  .blocks.dense i.idealine { flex:0 0 3px; min-width:3px; }
  /* a card with no Type set on GitHub: hatched, so it reads as needing attention */
  .notype { background-image:repeating-linear-gradient(45deg,
            rgba(0,0,0,.16) 0 2px, transparent 2px 5px) !important; }
  .vis-item.can-drag::after { content:''; position:absolute; right:0; top:0; bottom:0; width:7px;
              background:rgba(31,35,40,.5); border-left:1px solid #fff;
              border-radius:0 4px 4px 0; }
  /* the whole chart is a hand tool, apart from the due date handle and the card blocks */
  .vis-panel.vis-center, .vis-panel.vis-center * { cursor:grab; }
  .vis-panel.vis-center .blocks i, #table .cards i { cursor:pointer; }
  /* the row under the pointer, name and lane together, so a drag grabs the right release */
  .vis-labelset .vis-label.rowlit { background:rgba(24,29,38,.05); }
  .vis-foreground .vis-group.rowlit { background:rgba(24,29,38,.035); }
  .vis-labelset .vis-label.g-sprint.rowlit { background:rgba(0,187,167,.16); }
  .vis-foreground .vis-group.g-sprint.rowlit { background:rgba(0,187,167,.10); }
  /* The sprint pane floats ON TOP of the bars, so it is a real overlay rather than a vis
     background item: those render behind everything and could not refract what they cover.
     Liquid glass = heavy blur + saturation lift, a mint body tint, a bright specular rim on
     the top edge, and a soft drop shadow so the slab reads as lifted off the chart. */
  /* Clear glass in ingfah teal (#00BBA7, the TEAL token in zai-frontend). Almost no body
     tint, so the bars underneath stay readable; the glass reads from its edges instead -
     a bright rim, a thin teal inner glow, and a shadow hugging the border that lifts it. */
  #sprint { position:absolute; top:0; bottom:0; z-index:6; pointer-events:none; display:none;
            border-radius:16px; overflow:hidden;
            background:linear-gradient(170deg, rgba(255,255,255,.16) 0%,
                       rgba(0,187,167,.06) 40%, rgba(0,187,167,.15) 100%);
            backdrop-filter:blur(.5px) saturate(155%) brightness(1.03);
            -webkit-backdrop-filter:blur(.5px) saturate(155%) brightness(1.03);
            border:1px solid rgba(0,187,167,.62);
            box-shadow:0 2px 5px rgba(0,90,80,.20), 0 6px 14px rgba(0,90,80,.16),
                       0 14px 30px rgba(0,90,80,.10),
                       inset 0 1px 1px rgba(255,255,255,.9),
                       inset 0 0 16px rgba(0,187,167,.26),
                       inset 0 0 0 1px rgba(255,255,255,.35); }
  /* a thin specular sheen along the top edge only, so it catches light without milking over */
  #sprint::before { content:''; position:absolute; inset:0 0 auto 0; height:22%;
            background:linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0));
            border-radius:16px 16px 60% 60% / 16px 16px 14px 14px; }
  /* a soft dark halo just outside the rim, so the border itself casts the shadow */
  #sprint::after { content:''; position:absolute; inset:-1px; border-radius:17px;
            pointer-events:none; box-shadow:0 0 8px 1px rgba(0,90,80,.18); }
  /* max-width and the ellipsis are the safety net: if the label is measured before the web
     font loads, it trims from the end rather than losing characters off both sides */
  #sprint b { position:absolute; top:5px; left:50%; transform:translateX(-50%); z-index:1;
              font-size:10px; font-weight:500; letter-spacing:.4px; text-transform:uppercase;
              color:#006b60; background:rgba(255,255,255,.80); border-radius:12px;
              padding:2px 10px; white-space:nowrap; max-width:calc(100% - 8px);
              overflow:hidden; text-overflow:ellipsis; box-sizing:border-box;
              box-shadow:0 1px 3px rgba(0,90,80,.20), inset 0 1px 0 rgba(255,255,255,.9); }
  #tl.grabbing .vis-panel.vis-center, #tl.grabbing .vis-panel.vis-center * { cursor:grabbing !important; }
  #tl.edge .vis-panel.vis-center, #tl.edge .vis-panel.vis-center * { cursor:ew-resize !important; }
  .vis-panel.vis-left { width:440px; }
  .vis-labelset .vis-label { padding:0 12px 0 14px; display:flex; align-items:center;
                             border-bottom:1px solid #eef1f4; font-size:12px; }
  .vis-labelset .vis-label .vis-inner { width:100%; min-width:0; }
  .vis-labelset .vis-label.g-closed { color:#8c959f; }
  /* a ticked release reads as one mint row across the name column and the chart */
  .vis-labelset .vis-label.g-sprint { background:rgba(0,187,167,.08); }
  .vis-foreground .vis-group.g-sprint { background:rgba(0,187,167,.05); }
  tr.insprint td { background:rgba(0,187,167,.07); }
  .glab { display:flex; align-items:center; gap:8px; width:100%; min-width:0; }
  .gname { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gopen, .gcopy { flex:0 0 auto; color:var(--soft-muted); text-decoration:none; font-size:13px;
           line-height:1; padding:3px 4px; border-radius:6px; }
  .gopen:hover, .gcopy:hover { color:var(--link); background:var(--surface-soft); }
  .gcopy { cursor:pointer; user-select:none; }
  .vis-foreground .vis-group { border-bottom:1px solid #eef1f4; }
  .vis-item.vis-background.off { background:rgba(140,149,159,.20); }
  .vis-item.vis-background.holiday { background:rgba(207,34,46,.10); }
  .vis-current-time { background:#d33; width:2px; }
  .cnt { flex:0 0 auto; color:var(--soft-muted); font-size:11px; font-variant-numeric:tabular-nums; }
  a { color:var(--link); }
  a:active { color:var(--link-active); }
  .vis-tooltip { font-family:inherit !important; font-size:12px !important; background:var(--ink) !important;
                 color:#fff !important; border:0 !important; border-radius:6px !important;
                 padding:7px 10px !important; box-shadow:0 2px 10px rgba(0,0,0,.3) !important; }
  .vis-tooltip img { width:16px; height:16px; border-radius:50%; vertical-align:-3px; margin-right:4px; }

  /* ---- table ---- */
  .toolrow { display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px; margin-bottom:14px; }
  .toolrow b { font-size:15px; }
  /* notes: a pre-plan pile. Deliberately plainer than the chart, it is a scratchpad. */
  #ideaModal { position:fixed; inset:0; background:rgba(24,29,38,.4); z-index:50;
          display:flex; align-items:flex-start; justify-content:center; padding-top:14vh; }
  #ideaModal[hidden] { display:none; }    /* display:flex would out-rank the hidden attribute */
  .modalBox { background:var(--canvas); border:1px solid var(--hairline); border-radius:12px;
          padding:16px; width:min(560px, 92vw); box-shadow:0 12px 32px rgba(24,29,38,.18); }
  .noteFields input[type=date] { font:inherit; font-size:12px; color:var(--ink); padding:4px 8px;
          border:1px solid var(--hairline); border-radius:6px; background:var(--canvas); }
  .sechead { font-size:11px; font-weight:500; letter-spacing:.8px; text-transform:uppercase;
          color:var(--soft-muted); margin:16px 0 6px; }
  .sechead:first-child { margin-top:0; }
  .noteNew { background:var(--surface-soft); border:1px solid var(--hairline);
          border-radius:10px; padding:12px; }
  .noteNew textarea { width:100%; font:inherit; color:var(--ink); padding:8px 12px; resize:vertical;
            border:1px solid var(--hairline); border-radius:6px; background:var(--canvas); }
  .noteNew textarea:focus { outline:2px solid var(--focus); outline-offset:-1px; }
  .noteFields { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:8px 0 0; }
  .noteFields select { font:inherit; font-size:12px; color:var(--ink); padding:5px 8px;
            border:1px solid var(--hairline); border-radius:6px; background:var(--canvas); }
  .note { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; margin-top:8px;
          border:1px solid var(--hairline); border-radius:8px; background:var(--canvas); }
  .note .body { flex:1 1 auto; min-width:0; }
  .note .title { color:var(--ink); font-weight:500; word-break:break-word; }
  .note .rest { color:var(--muted); font-size:12px; white-space:pre-wrap; word-break:break-word;
          margin-top:2px; }
  .note .meta { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .note .chip { font-size:11px; padding:1px 8px; }
  .note .acts { flex:0 0 auto; display:flex; gap:2px; }
  .note .acts span { cursor:pointer; color:var(--soft-muted); padding:3px 5px; border-radius:6px;
          font-size:13px; user-select:none; }
  .note .acts span:hover { color:var(--ink); background:var(--surface-soft); }
  .note.done .title, .note.done .rest { text-decoration:line-through; color:var(--soft-muted); }
  /* tabs: the release view and the priorities view never share a screen */
  .tabs { display:flex; gap:16px; align-self:flex-end; }
  .tabs button { border:none; background:none; border-radius:0; padding:4px 2px 6px;
          color:var(--muted); border-bottom:2px solid transparent; }
  .tabs button:hover { background:none; color:var(--ink); }
  .tabs button.on { color:var(--ink); border-bottom-color:var(--ink); }
  /* priorities: four boxes, effort across, impact down */
  .quadCols { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;
          font-size:12px; color:var(--muted); text-align:center; }
  .quadGrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .qcell, #qtray { border:1px solid var(--hairline); border-radius:10px; padding:10px;
          min-height:150px; background:var(--surface-soft); }
  .qcell.over, #qtray.over { outline:2px solid var(--focus); outline-offset:-2px; }
  .qhead { font-size:12px; font-weight:500; color:var(--ink); }
  .qhead .muted { font-weight:400; margin-left:6px; }
  #qtray { margin-top:10px; min-height:56px; border-style:dashed; background:var(--canvas); }
  .qnote { background:var(--canvas); border:1px solid var(--hairline); border-radius:8px;
          padding:6px 9px; margin-top:8px; cursor:grab; font-size:12px; }
  .qnote:active { cursor:grabbing; }
  .qnote .title { color:var(--ink); font-weight:500; word-break:break-word; }
  .qnote .meta { display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; }
  .qnote .chip { font-size:10px; padding:0 7px; }
  .qnote .acts { float:right; margin-left:6px; cursor:pointer; color:var(--soft-muted);
          font-size:12px; }
  .qnote .acts:hover { color:var(--ink); }
  /* an idea waiting on a release: a teal line at the front of the bar, the name on hover */
  .blocks i.idealine { flex:0 0 4px; min-width:4px; background:rgba(0,187,167,.8);
          border-bottom-color:transparent; cursor:default; }
  #tableBox { max-height:calc(100vh - 180px); overflow:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:5px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
           vertical-align:middle; line-height:1.3; }
  th:first-child, td:first-child { padding-left:4px; }
  th { padding-top:8px; padding-bottom:8px; }
  /* the three columns Eddie reads most get the room; the rest give it up */
  .col-prog, .col-build, .col-fix { padding-left:14px; padding-right:14px; }
  .col-state, .col-devs, .col-qas { padding-left:8px; padding-right:8px; }
  .col-sprint { padding-left:4px; padding-right:4px; text-align:center; }
  .dates { font-variant-numeric:tabular-nums; }
  .dates .late { color:var(--late); font-weight:500; }
  th { color:var(--muted); font-weight:500; cursor:pointer; user-select:none; position:sticky; top:0;
       background:var(--card); z-index:2; }
  th:hover { color:var(--ink); }
  th .arrow { opacity:.35; font-size:10px; }
  th.sorted .arrow { opacity:1; }
  tr.closed td { color:var(--soft-muted); }
  td.late { color:var(--late); font-weight:500; }
  .rel { color:inherit; cursor:pointer; border-bottom:1px dotted var(--hairline); }
  .rel:hover { color:var(--link); border-bottom-color:var(--link); }
  td .gopen { margin-left:6px; }
  /* a span, not a link: it gets no hand cursor from the browser, so it says clickable itself */
  .gclose { cursor:pointer; user-select:none; }

  /* The pie is the tallest thing in a row at 26px, so it sets the row height. Everything
     else grows to 24px to use that space instead of floating in it: the rows do not get
     any taller, the bars just stop wasting the margin they already had. */
  .ratio { display:flex; height:24px; border-radius:8px; overflow:hidden;
           border:1px solid var(--hairline); background:var(--surface-soft); }
  .ratio .seg { height:100%; display:flex; align-items:center; justify-content:center;
                overflow:hidden; min-width:3px; }
  .ratio .face { width:20px; height:20px; border-radius:50%; display:block;
                 border:1.5px solid rgba(255,255,255,.9); flex:0 0 auto; }
  /* one block per card, so a count is readable by eye even when the bar fills the column */
  .cards { display:flex; height:24px; border-radius:8px; overflow:hidden;
           border:1px solid var(--hairline); background:var(--surface-soft); }
  .cards i { flex:1 1 0; min-width:3px; box-sizing:border-box;
             border-right:1px solid var(--canvas); }
  .cards i:last-child { border-right:0; }
  .cards.none { border-style:dashed; }
  .cellrow { display:flex; align-items:center; gap:8px; }
  .pie { width:26px; height:26px; border-radius:50%; flex:0 0 auto; display:block;
         box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85), 0 0 0 1px var(--hairline); }
  .pie.empty { background:var(--surface-soft); box-shadow:0 0 0 1px var(--hairline); }
  #tip .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; }
  /* 10 + 4 + 10 = 24px, matching the other bars without pushing past the 26px pie */
  .pbar { display:flex; height:10px; border-radius:3px; overflow:hidden; background:var(--surface-soft);
          border:1px solid var(--hairline); }

  /* the hourly GitHub budget: a bar rather than a number, so an unusual level is seen and
     not read. Amber under a quarter left, red under a tenth. */

           font-variant-numeric:tabular-nums; }

  @property --shimmer { syntax:"<angle>"; inherits:false; initial-value:33deg; }
  @keyframes shimmerSpin { 0% { --shimmer:0deg } 100% { --shimmer:360deg } }

<script type="module">
const OWNER = '100x-fi'
const REPOS = ['zai-backend','zai-frontend','zai-bo-frontend','ingfah-rag','ingfah-dev-docs','zai-docs']
const BOARD_NUMBER = 6                      // the project the statuses are read from
const PROJECT_SLICE = 'https://github.com/orgs/100x-fi/projects/6/views/5?sliceBy%5Bvalue%5D='

// github.com's OAuth token endpoint sends no CORS headers, so a page served from GitHub Pages
// cannot finish a login on its own. EXCHANGE is the one small worker that can: it holds the
// OAuth app's client secret and swaps the single-use code for a token. auth/README.md has the
// app and the worker, and what to do if either ever has to be rebuilt.
const CLIENT_ID = 'Ov23ligjYU8yfTEQgmUk'    // from the OAuth app
const EXCHANGE  = 'https://ingfah-roadmap-auth.nammon-79f.workers.dev/exchange'
const SCOPES    = 'repo read:project'   // read the board, write milestone due dates
// GitHub only sends the reply to the callback the OAuth app registered, so this has to be the
// page's own address with nothing on the end of it
const REDIRECT  = location.origin + location.pathname
const REFRESH_MS = 15 * 60 * 1000
const QA = new Set(['kat100xfi','subzero-ice','viviintern-eng'])
const STATUS_TODO = 'To Do'
const STATUS_READY = 'Ready for Test'
const STATUS_DONE  = 'Done'
const WORKING = new Set(['In Progress','Review (Dev tested carefully)','Review','Not Ready for Test',
                         STATUS_READY, STATUS_DONE])

// the Status field of the board, in board order, with the colour the board gives each option
// The colour name matches the board option, but the tone is Primer's soft step, not the loud
// text tone. A bar is read as a proportion, so it wants the same weight as a status pill.
const BOARD = [
  { s:'Backlog',                       c:'#afb8c1', short:'Backlog' },              // gray
  { s:'To Do',                         c:'#80ccff', short:'To Do' },                // blue
  { s:'In Progress',                   c:'#f2cc60', short:'In Progress' },          // yellow
  { s:'Review (Dev tested carefully)', c:'#ff9492', short:'Review' },               // red
  { s:'Not Ready for Test',            c:'#ffb77c', short:'Not Ready for Test' },   // orange
  { s:'Ready for Test',                c:'#c297ff', short:'Ready for Test' },       // purple
  { s:'Done',                          c:'#4ac26b', short:'Done' }                  // green
]
const STATUS_COLOR = {}, STATUS_SHORT = {}
for (const b of BOARD) { STATUS_COLOR[b.s] = b.c; STATUS_SHORT[b.s] = b.short }
// Reading order for every bar: Done first. A bar fills from the left as work finishes, the
// way a loading bar does, so the left hand end always means "already delivered".
const DONE_FIRST = [...BOARD].reverse()
const DONE_FIRST_KEYS = DONE_FIRST.map(b => b.s)

// One colour per repo, used only by the pies. Two things had to be true at once: the slices
// must be easy to tell apart from EACH OTHER in a 26px circle, and none may read as a status.
// Chosen by search rather than by eye (roadmap-tools/pie-palette.mjs): closest two repos are
// 47 apart in Lab space, closest repo to any status or type colour is 34.6, and 30 is the
// point where two colours stop being confusable. Several are Okabe-Ito colourblind-safe hues.
const REPO_COLOR = { 'zai-backend':'#0072B2', 'zai-frontend':'#D55E00', 'zai-bo-frontend':'#b3123c',
                     'ingfah-rag':'#6b2d8f', 'ingfah-dev-docs':'#4a6b00', 'zai-docs':'#00695c' }
const REPO_SHORT = { 'zai-backend':'BE', 'zai-frontend':'FE', 'zai-bo-frontend':'FE B/O',
                     'ingfah-rag':'RAG', 'ingfah-dev-docs':'DOCS', 'zai-docs':'ZDOCS' }

// same hues as the Type field on the board, toned down: this bar is read as a proportion,
// not as a warning light
const TYPE_COLOR = { Story:'#8fd0a0', Task:'#9dc2f0', Bug:'#f0a8a8', Defect:'#f2c295',
                     Epic:'#c4b0ea', 'no type':'#d8dee4' }

// Thai public holidays. The lunar ones (Makha, Visakha, Asarnha, Khao Phansa) move every year,
// so check them against the Bank of Thailand calendar before rolling this list forward.
const HOLIDAYS = new Set([
  '2026-01-01','2026-03-03','2026-04-06','2026-04-13','2026-04-14','2026-04-15',
  '2026-05-01','2026-05-04','2026-06-01','2026-06-03','2026-07-28','2026-07-29',
  '2026-07-30','2026-08-12','2026-10-13','2026-10-23','2026-12-07','2026-12-10','2026-12-31'
])

let windowDays = 14        // how long a closed release stays on the page; Show older grows it

const MS_FIELDS = `
  number title dueOn createdAt closedAt
  issues(first:$iss){
    totalCount
    nodes{
      number title state stateReason
      issueType{ name }
      assignees(first:5){ nodes{ login avatarUrl } }
      projectItems(first:5){ nodes{ project{ number }
        fieldValueByName(name:"Status"){ ... on ProjectV2ItemFieldSingleSelectValue { name } } } }
      timelineItems(first:40, itemTypes:[PROJECT_V2_ITEM_STATUS_CHANGED_EVENT]){
        nodes{ ... on ProjectV2ItemStatusChangedEvent { createdAt previousStatus status } }
      }
    }
  }`

// Open and closed are fetched separately on purpose: asking for both in one query goes over
// GitHub's resource limit and the whole request fails.
//
// The hourly budget is 5000 points and a query costs about (milestones x issues) / 50 points,
// so the page sizes below are the real cost control. Nothing else in the query moves the price.
// Closed milestones start small because only the last two weeks are drawn; Show older asks for
// more of them, once, on demand.
const OPEN_MS = 30            // biggest repo has 20 open milestones today
// GitHub resolves only so much nested data per query and says nothing when it stops. Asking
// for 30 milestones at once came back with the timeline of 11 zai-backend cards missing
// entirely and others cut short, which read on the page as cards sitting in Backlog and as
// releases that had started being drawn as plans. Ten milestones a page comes back whole.
// The points cost is the same either way, it is only more round trips.
const PAGE_MS = 10
const ISSUES  = 70            // biggest milestone ever had 64 cards
// zai-backend closed 12 milestones inside one 14 day window, so 10 was already too few
let closedMs  = 20            // grows when Show older is pressed
const RATE_HEAD = `rateLimit{ remaining resetAt } viewer{ login }`
const PAGE_INFO = `pageInfo{ hasNextPage endCursor }`
const Q_OPEN = `
query($owner:String!,$name:String!,$ms:Int!,$iss:Int!,$after:String){
  ${RATE_HEAD}
  repository(owner:$owner,name:$name){
    milestones(first:$ms, after:$after, states:OPEN){ ${PAGE_INFO} nodes{ ${MS_FIELDS} } }
  }
}`
const Q_CLOSED = `
query($owner:String!,$name:String!,$ms:Int!,$iss:Int!,$after:String){
  ${RATE_HEAD}
  repository(owner:$owner,name:$name){
    milestones(first:$ms, after:$after, states:CLOSED, orderBy:{field:DUE_DATE, direction:DESC}){
      ${PAGE_INFO} nodes{ ${MS_FIELDS} } }
  }
}`

const $ = id => document.getElementById(id)
const day = s => s ? dayOf(+new Date(s)) : null
const token = () => localStorage.getItem('ghToken') || ''
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const pct = (a, b) => b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0
// Every date on this page is a Bangkok date, whatever clock the browser is set to. A laptop
// in another zone, or Bangkok itself before 07:00 or after 17:00, used to slide the answer by
// a day: the UTC date is behind until 07:00 and a card finished at 20:00 was filed as
// yesterday. Bangkok has no daylight saving, so a fixed +07:00 is the whole story.
const TZ = 'Asia/Bangkok'
const TZ_OFF = '+07:00'
const TZ_MS = 7 * 3600e3
// the Bangkok date an instant falls in, and the instant a Bangkok date starts at
const dayOf = ms => new Date(ms + TZ_MS).toISOString().slice(0,10)
const bkk = iso => new Date(iso + 'T00:00:00' + TZ_OFF)
const todayISO = () => dayOf(Date.now())
const TOMORROW = dayOf(Date.now() + 864e5)
// a date string is already a Bangkok date, so it is printed exactly as it is written
const pretty = s => new Date(s + 'T00:00:00Z')
  .toLocaleDateString('en-GB', { day:'numeric', month:'short', timeZone:'UTC' })
const clock = ms => new Date(ms).toLocaleTimeString('en-GB',
  { hour:'2-digit', minute:'2-digit', timeZone:TZ })

let rate = null                          // what GitHub last told us about the hourly budget
let me = null                            // the login GitHub says we are signed in as

// An app the org has not approved sees private repos as though they do not exist, so GitHub
// answers "could not resolve" and the real problem never reaches the screen. Say that instead.
const noAccess = name => 'Signed in' + (me ? ' as @' + me : '') + ', but this account cannot see '
  + OWNER + '/' + name + '. An owner of ' + OWNER + ' has to approve the roadmap app under '
  + 'Settings \u2192 Third-party Access, and you have to be signed in as a member of the org.'

// ---- sign-in --------------------------------------------------------------------------
// PKCE: the code GitHub puts in the address bar is worthless without the verifier, and the
// verifier never leaves this tab. It is what stops a leaked URL from becoming a login.
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
const randStr = n => b64url(crypto.getRandomValues(new Uint8Array(n)))
const s256 = async s => b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))
const CONFIGURED = Boolean(CLIENT_ID && EXCHANGE)

// the signed out page is the whole viewport, so it goes on and off as one class
const gateOn  = () => $('gate').classList.add('on')
const gateOff = () => $('gate').classList.remove('on')

async function signIn() {
  const verifier = randStr(48)           // 64 characters, inside GitHub's 43-128 range
  const state = randStr(16)
  // sessionStorage, not localStorage: this reply is only ever meant for the tab that asked
  sessionStorage.setItem('ghPkce', JSON.stringify({ verifier, state }))
  location.href = 'https://github.com/login/oauth/authorize?' + new URLSearchParams({
    client_id: CLIENT_ID, redirect_uri: REDIRECT, scope: SCOPES, state,
    code_challenge: await s256(verifier), code_challenge_method: 'S256'
  })
}

function gateFail(msg) {
  gateOn()
  $('gateErr').textContent = msg
  return true                            // a failed login is still not a plain signed-out page
}

// True when this page load was a return from GitHub, so the caller knows not to go asking for
// data behind a login that just failed.
async function finishSignIn() {
  const q = new URLSearchParams(location.search)
  if (!q.get('code') && !q.get('error')) return false
  // the code is single use and has no business sitting in the address bar or in a bookmark
  history.replaceState(null, '', REDIRECT)
  let saved = null
  try { saved = JSON.parse(sessionStorage.getItem('ghPkce') || 'null') } catch (e) {}
  sessionStorage.removeItem('ghPkce')

  if (q.get('error')) return gateFail(q.get('error_description') || q.get('error'))
  if (!saved || saved.state !== q.get('state'))
    return gateFail('That sign-in did not come back to the tab that started it. Try again.')

  gateOn()
  $('gateErr').textContent = ''
  $('signin').disabled = true
  $('signinText').textContent = 'Signing in\u2026'
  try {
    const res = await fetch(EXCHANGE, {
      method: 'POST', headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ code:q.get('code'), code_verifier:saved.verifier, redirect_uri:REDIRECT })
    })
    const j = await res.json().catch(() => ({}))
    if (!res.ok || !j.access_token)
      throw new Error(j.error_description || j.error || 'the exchange answered HTTP ' + res.status)
    localStorage.setItem('ghToken', j.access_token)
  } catch (e) {
    return gateFail('Could not finish the sign-in: ' + e.message)
  } finally {
    $('signin').disabled = false
    $('signinText').textContent = 'Sign in with GitHub'
  }
  return true
}

function signOut() {
  localStorage.removeItem('ghToken')
  localStorage.removeItem(CACHE)         // the next person here must not find these numbers
  location.href = REDIRECT
}

async function ask(query, name, ms, after) {
  const res = await fetch('https://api.github.com/graphql', {
    method:'POST',
    // no-store: a refresh has to reach GitHub, never a copy of the last answer
    cache: 'no-store',
    headers:{ 'Authorization':'Bearer ' + token(), 'Content-Type':'application/json' },
    body: JSON.stringify({ query, variables:{ owner:OWNER, name, ms, iss:ISSUES, after:after || null } })
  })
  // revoked, or the org withdrew the app; either way the way back is a fresh sign-in
  if (res.status === 401) {
    localStorage.removeItem('ghToken')
    throw new Error('GitHub rejected the sign-in. Sign in again.')
  }
  const json = await res.json()
  if (json.data && json.data.rateLimit) { rate = json.data.rateLimit; paintQuota() }
  if (json.data && json.data.viewer) me = json.data.viewer.login
  if (json.errors) {
    const e = json.errors[0]
    if (e.type === 'NOT_FOUND') throw new Error(noAccess(name))
    if (e.type === 'RATE_LIMITED' || /rate limit/i.test(e.message)) {
      const back = rate && rate.resetAt ? clock(+new Date(rate.resetAt)) : 'soon'
      throw new Error('GitHub hourly API budget is used up. It comes back at ' + back
        + '. The page is showing the last data it loaded.')
    }
    throw new Error(e.message)
  }
  const repo = json.data && json.data.repository
  if (!repo) throw new Error(noAccess(name))
  return repo.milestones
}

// Walk the pages until `want` milestones are in hand, and say whether GitHub still had more.
async function askAll(query, name, want) {
  const nodes = []
  let after = null
  while (nodes.length < want) {
    const page = await ask(query, name, Math.min(PAGE_MS, want - nodes.length), after)
    nodes.push(...page.nodes)
    if (!page.pageInfo.hasNextPage) return { nodes, more:false }
    after = page.pageInfo.endCursor
  }
  return { nodes, more:true }
}

let truncated = []                       // milestones holding more cards than one page returns
let capped = []                          // repos where the milestone page came back full

async function fetchRepo(name) {
  const [open, closed] = await Promise.all([askAll(Q_OPEN, name, OPEN_MS),
                                            askAll(Q_CLOSED, name, closedMs)])
  for (const m of [...open.nodes, ...closed.nodes]) {
    if (m.issues.totalCount > m.issues.nodes.length) truncated.push(name + ' ' + m.title)
  }
  // a full page means there is probably more behind it, and staying quiet about that would
  // read as "this is everything"
  if (open.more || closed.more) capped.push(name)
  return [
    ...open.nodes.map(m => ({ ...m, repo:name, isClosed:false })),
    ...closed.nodes.map(m => ({ ...m, repo:name, isClosed:true }))
  ]
}

// One release = one milestone title, merged across every repo that has it.
function build(all) {
  const today = todayISO()
  const by = new Map()
  for (const m of all) {
    if (!by.has(m.title)) by.set(m.title, { title:m.title, due:day(m.dueOn), born:day(m.createdAt),
                                            issues:[], refs:[], closed:true, closedAt:null })
    const row = by.get(m.title)
    // A closed copy in one repo must not pin the deadline of a release that is still open
    // elsewhere: dragging only ever writes to the open copies, so an older closed date would
    // hold the displayed due date back for good. Among open copies the earliest still wins.
    if (!m.isClosed && (row.openDue === undefined || day(m.dueOn) < row.openDue)) {
      row.openDue = day(m.dueOn)
    }
    if (day(m.dueOn) < row.due) row.due = day(m.dueOn)
    if (day(m.createdAt) < row.born) row.born = day(m.createdAt)
    // the last repo to close it is when the release really ended
    if (m.closedAt && (!row.closedAt || day(m.closedAt) > row.closedAt)) row.closedAt = day(m.closedAt)
    if (!m.isClosed) row.closed = false        // open anywhere means the release is still open
    // every repo copy of this title, so one drag can move them all together
    row.refs.push({ repo:m.repo, number:m.number, dueOn:m.dueOn, closed:m.isClosed })
    // an Epic is a container, not a card: it would add a phantom release with no real work.
    // A card closed as not planned or as a duplicate was decided against, not delivered, so it
    // is no part of the release: not a block, not in the counts. Ordinary closed cards stay.
    row.issues.push(...m.issues.nodes
      .filter(i => !i.issueType || i.issueType.name !== 'Epic')
      .filter(i => i.stateReason !== 'NOT_PLANNED' && i.stateReason !== 'DUPLICATE')
      .map(i => ({ ...i, repo: m.repo })))
  }

  const out = []
  for (const row of by.values()) {
    if (!row.issues.length) continue          // nothing left after Epics were removed
    if (row.openDue !== undefined) row.due = row.openDue   // open copies decide an open release
    const events = row.issues.flatMap(i => i.timelineItems.nodes)

    // Start of work = the first time any card LEFT "To Do", whatever it went to.
    // If nothing ever left To Do, fall back to the first card that reached a working status
    // (a card can jump straight from Backlog), then to the day the milestone was made.
    const leftToDo = events.filter(e => e.previousStatus === STATUS_TODO)
      .map(e => day(e.createdAt)).sort()
    const reachedWork = events.filter(e => WORKING.has(e.status))
      .map(e => day(e.createdAt)).sort()
    const startedAt = leftToDo[0] || reachedWork[0] || null

    const dones = events.filter(e => e.status === STATUS_DONE).map(e => day(e.createdAt)).sort()
    const lastDone = dones.length ? dones[dones.length - 1] : null
    const late = !!(lastDone && lastDone > row.due)

    const types = {}, people = new Map(), statuses = {}, cards = []
    for (const i of row.issues) {
      const t = (i.issueType && i.issueType.name) || 'no type'
      types[t] = (types[t] || 0) + 1
      // The Status field of the board is the answer, full stop. Whether the issue is open or
      // closed on GitHub is not a status and is not read anywhere on this page. A card on no
      // board at all has only its status trail to go on, and nothing at all if it has never
      // been moved: 4 of 721 cards are in that position today.
      const item = i.projectItems.nodes.find(n => n.project && n.project.number === BOARD_NUMBER)
      const board = item && item.fieldValueByName ? item.fieldValueByName.name : null
      const last = [...i.timelineItems.nodes].sort((a,b) => a.createdAt.localeCompare(b.createdAt)).pop()
      const now = board || (last && last.status) || 'Backlog'
      statuses[now] = (statuses[now] || 0) + 1
      cards.push({ repo:i.repo, number:i.number, type:t, status:now, offBoard: !item,
        open: i.state === 'OPEN', title: i.title, people: i.assignees.nodes })
      for (const a of i.assignees.nodes) {
        const p = people.get(a.login) || { login:a.login, avatar:a.avatarUrl, n:0, qa:QA.has(a.login) }
        p.n++; people.set(a.login, p)
      }
    }

    // Nothing has left To Do yet, so the work has not begun: draw it as starting tomorrow.
    // Old closed releases predate the board and have no history at all, so those keep the day
    // the milestone was made, otherwise they would draw backwards from tomorrow into last year.
    const start = startedAt || (row.closed ? row.born : TOMORROW)
    const endDate = late ? lastDone : row.due
    const span = (new Date(row.due) - new Date(start)) / 864e5
    const gone = (new Date(today) - new Date(start)) / 864e5
    const all2 = [...people.values()].sort((a,b) => b.n - a.n)
    const done = statuses[STATUS_DONE] || 0
    const ready = statuses[STATUS_READY] || 0
    // Done on the left, Backlog on the right, so the delivered share reads as a filled bar
    cards.sort((a, b) => DONE_FIRST_KEYS.indexOf(a.status) - DONE_FIRST_KEYS.indexOf(b.status)
      || a.type.localeCompare(b.type) || a.number - b.number)

    out.push({
      title: row.title, name: cleanTitle(row.title), refs: row.refs,
      due: row.due, start, end: endDate,
      startedAt, lastDone, late, born: row.born, closedAt: row.closedAt,
      // Slipped is a live risk: the due date has passed and cards are still not Done.
      // Finishing late is a separate fact, kept in `late`, and shown in the date column.
      // A closed release is just closed, whatever happened on the way.
      state: row.closed ? 'closed'
           : (row.due < today && done < row.issues.length) ? 'slipped'
           : startedAt ? 'running' : 'upcoming',
      overdueBy: row.due < today
        ? Math.round((new Date(today) - new Date(row.due)) / 864e5) : 0,
      barStart: start < endDate ? start : endDate,
      barEnd:   start < endDate ? endDate : start,
      total: row.issues.length, done, ready, types, statuses, cards,
      devs: all2.filter(p => !p.qa), qas: all2.filter(p => p.qa),
      cardPct: pct(done + ready, row.issues.length),
      donePct: pct(done, row.issues.length),
      timePct: row.closed ? 100 : pct(gone, span)
    })
  }
  return out.sort((a,b) => a.end.localeCompare(b.end) || a.due.localeCompare(b.due))
}

/* ---- this sprint: planning the releases that have not started yet ---- */
// The name with the date stamp and any [Closed on ...] taken off the front. Moving a due date
// renames the milestone, so the title is not a stable way to remember anything about a release:
// the tick is kept against this instead, and survives the rename.
const cleanTitle = t => t.replace(/^\[Closed on \d{8}\]\s*/, '').replace(/^\d{8}\s*/, '').trim()
// Only a release that has never left To Do can be planned. One that has really started keeps
// the date it really started on, ticked or not: that is a fact, not a plan.
let thisSprint = new Set()
// cleanTitle on the way in, so ticks saved against the old full title still land
try { thisSprint = new Set(JSON.parse(localStorage.getItem('thisSprint') || '[]').map(cleanTitle)) }
catch (e) {}

const isWorkday = iso => {
  const dow = new Date(iso + 'T00:00:00Z').getUTCDay()
  return dow !== 0 && dow !== 6 && !HOLIDAYS.has(iso)
}
function nextWorkday(iso, includeToday) {
  let d = includeToday ? iso : plus(iso, 1)
  for (let i = 0; i < 60 && !isWorkday(d); i++) d = plus(d, 1)
  return d
}

// Where an unstarted release is drawn: in this sprint it begins now, otherwise it queues up
// on the first working day after the sprint ends.
function plannedStart(r) {
  const today = todayISO()
  if (thisSprint.has(r.name)) return nextWorkday(today, true)
  if (sprint && sprint.to) return nextWorkday(sprint.to, false)
  return TOMORROW
}

// Recomputed on every draw rather than baked into build(), because ticking a box or moving
// the sprint changes the answer without any need to talk to GitHub again.
function applyPlan(rows) {
  const today = todayISO()
  for (const r of rows) {
    r.inSprint = thisSprint.has(r.name) && r.state !== 'closed'
    r.planned = !r.startedAt && r.state !== 'closed'
    const start = r.startedAt || (r.state === 'closed' ? r.born : plannedStart(r))
    // The bar ends at the DUE date, always. It used to stretch to the last real Done when
    // that came later, which is true but reads as the due date being wrong: a card moved to
    // Done this morning pushed two bars one day past the date printed in the table. The late
    // finish stays in the date column ("done 19 Aug") and in the bar tooltip.
    const end = r.due
    r.start = start
    r.barStart = start < end ? start : end
    r.barEnd = start < end ? end : start
    const span = (new Date(r.due) - new Date(start)) / 864e5
    const gone = (new Date(today) - new Date(start)) / 864e5
    r.timePct = r.state === 'closed' ? 100 : pct(gone, span)
  }
  paintTicks()
  return rows
}

// the ticks live in this browser, so the button is only ever offered when there are some
function paintTicks() {
  const b = $('ticksClear')
  if (b) b.disabled = !thisSprint.size
}

function clearTicks() {
  thisSprint.clear()
  localStorage.removeItem('thisSprint')
  applyPlan(rowsCache)
  drawTable(); drawTimeline(rowsCache)
}

function toggleSprint(name) {
  const row = rowsCache.find(r => r.name === name)
  if (row && row.state === 'closed') return       // closed is a fact, not a plan
  if (thisSprint.has(name)) thisSprint.delete(name); else thisSprint.add(name)
  localStorage.setItem('thisSprint', JSON.stringify([...thisSprint]))
  applyPlan(rowsCache)
  drawTable(); drawTimeline(rowsCache)
}

// a closed release drops off the page once it has been closed for longer than the window
const inWindow = r => r.state !== 'closed' ||
  (r.closedAt || r.end) >= dayOf(Date.now() - windowDays * 864e5)

const STATE_LABEL = { upcoming:'upcoming', running:'in progress', slipped:'slipped', closed:'closed' }

/* ---- this sprint tick: the same control in the table and in the chart ---- */
function tickTip(r) {
  return r.startedAt ? 'Already started on ' + pretty(r.startedAt)
           + ', so the bar keeps that date either way'
       : r.inSprint ? 'Planned to start now'
       : sprint && sprint.to ? 'Queued for the first working day after the sprint'
       : 'Set a sprint to queue this after it'
}

// The block is the board column, always. The only thing left to say is when there is no
// column to read, because the card was never put on the board.
function whyStatus(c) {
  return c.offBoard ? '<br><i>not on the board, so it has no status</i>' : ''
}

const issueUrl = c => 'https://github.com/' + OWNER + '/' + c.repo + '/issues/' + c.number

/* ---- search: milestone names and card titles, one box for the table and the chart ---- */
// Card BODIES are not searched: they are never fetched. 700 card bodies in the house format
// would put megabytes on every refresh and blow the row cache out of localStorage.
let searchQ = ''
const matchCard = c => !!searchQ && (c.title || '').toLowerCase().includes(searchQ)
const rowMatch = r => !searchQ
  || r.name.toLowerCase().includes(searchQ) || r.cards.some(matchCard)

// what one card block says on hover: where it is, what it is called, who is on it.
// Old cached rows predate the title and the assignees, so both lines vanish gracefully
// until the next refresh.
function cardTip(c) {
  return '<b>' + esc(REPO_SHORT[c.repo] || c.repo) + ' #' + c.number + '</b> &middot; ' + esc(c.type)
    // the status as an outline pill in the board's colour, on the headline where it is read
    + ' <span class="pill outline" style="border-color:' + (STATUS_COLOR[c.status] || '#afb8c1')
    + ';color:' + (STATUS_COLOR[c.status] || '#afb8c1') + '">'
    + esc(STATUS_SHORT[c.status] || c.status) + '</span>'
    + (c.title ? '<br>' + esc(c.title) : '')
    + whyStatus(c)
    + (c.people && c.people.length
        ? '<br>' + c.people.map(p => '<img src="' + esc(p.avatarUrl) + '&s=32"> '
            + esc(p.login)).join('<br>')
        : '')
    + '<br><i>click to open the card</i>'
}

/* ---- timeline ---- */
let timeline = null, items = null
function faces(list) {
  return list.slice(0,6).map(p => '<img src="' + esc(p.avatar) + '&s=32" title="' + esc(p.login) + '">').join('')
}
function itemTooltip(r) {
  const byRepo = {}
  for (const c of r.cards) byRepo[c.repo] = (byRepo[c.repo] || 0) + 1
  return '<b>' + esc(r.name) + '</b> &middot; ' + STATE_LABEL[r.state] + '<br>'
    + pretty(r.start) + ' to ' + pretty(r.due)
    + (r.late && r.lastDone ? ' <i>(last card done ' + pretty(r.lastDone) + ')</i>' : '')
    + (r.startedAt ? '' : ' <i>(nothing started yet)</i>') + '<br>'
    + r.done + ' done' + (r.ready ? ' + ' + r.ready + ' ready for test' : '') + ' of ' + r.total + ' cards<br>'
    + Object.entries(byRepo).map(([k, n]) => REPO_SHORT[k] + ' ' + n).join(' &middot; ') + '<br>'
    + 'cards ' + Math.round(r.cardPct) + '% &middot; time ' + Math.round(r.timePct) + '%'
    + (r.devs.length ? '<br>' + faces(r.devs) : '')
    + (r.qas.length ? ' | ' + faces(r.qas) : '')
}

// IMPORTANT: build the bar and the label as real DOM, never as an HTML string. vis runs any
// string through an XSS filter that allows no attributes at all, which quietly removed the
// block colours, the tooltips and the drag handle marker and left one flat bar behind.
const elem = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e }

// one equal block per card: fill is how far the card has moved, the stripe underneath is its type
function blocksEl(r, i) {
  const wrap = elem('span', 'blocks' + (searchQ && r.cards.some(matchCard) ? ' hashit' : ''))
  wrap.dataset.id = i
  wrap.dataset.tip = itemTooltip(r)
  const grey = r.state === 'closed'
  for (const n of liveNotes()) {
    if (isArch(n) || n.ms !== r.title) continue
    const l = elem('i', 'idealine')
    l.dataset.tip = '💡 ' + esc(noteTitle(n)) + '<br><i>idea, here ' + ideaAge(n.createdAt) + '</i>'
    wrap.appendChild(l)
  }
  for (const c of r.cards) {
    const b = elem('i', (c.type === 'no type' ? 'notype' : '') + (matchCard(c) ? ' hit' : ''))
    b.style.background = grey ? '#dde2e7' : (STATUS_COLOR[c.status] || '#afb8c1')
    b.style.borderBottomColor = grey ? '#c6cdd5' : (TYPE_COLOR[c.type] || TYPE_COLOR['no type'])
    b.dataset.tip = cardTip(c)
    // a click opens the card, but only a CLICK: the chart is also the pan surface, and a
    // browser fires click after a drag too, so anything that moved is the hand tool's
    b.onclick = e => {
      if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 4) return
      window.open(issueUrl(c), '_blank', 'noopener')
    }
    wrap.appendChild(b)
  }
  return wrap
}

// the full milestone title, date prefix and all, which is what a GitHub filter wants
function copyTitle(title) {
  navigator.clipboard.writeText(title).then(
    () => toast('Copied ' + title, 'ok'),
    () => toast('The browser would not give the page the clipboard.', 'err'))
}

function tickEl(r) {
  const t = elem('span', 'tick gtick' + (r.inSprint ? ' on' : ''))
  t.textContent = r.inSprint ? '☑' : '☐'
  // a closed release cannot be planned, so it keeps the space and loses the control
  if (r.state === 'closed') { t.className = 'tick gtick ghost'; return t }
  t.dataset.tip = tickTip(r)
  t.tabIndex = 0
  t.setAttribute('role', 'checkbox')
  t.setAttribute('aria-checked', !!r.inSprint)
  t.onclick = e => { e.stopPropagation(); toggleSprint(r.name) }
  t.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); t.click() } }
  return t
}

// [tick] {name} [state] (done/total) [close the release] [open in a new tab]
function labelEl(r) {
  const wrap = elem('span', 'glab')
  const name = elem('span', 'gname')
  name.textContent = r.name
  name.dataset.tip = esc(r.name) + '<br><i>click to copy the milestone name</i>'
  name.style.cursor = 'pointer'
  name.onclick = e => { e.stopPropagation(); copyTitle(r.title) }
  const pill = elem('span', 'pill ' + r.state)
  pill.textContent = STATE_LABEL[r.state]
  pill.dataset.tip = stateWhy(r)
  const cnt = elem('span', 'cnt')
  cnt.textContent = '(' + r.done + '/' + r.total + ')'
  const open = elem('a', 'gopen')
  open.href = PROJECT_SLICE + encodeURIComponent(r.title)
  open.target = '_blank'
  open.rel = 'noopener'
  open.title = 'Open the board filtered to this milestone'
  open.textContent = '↗'
  wrap.append(tickEl(r), name, pill, cnt)
  if (r.state !== 'closed') {
    const flag = elem('span', 'gopen gclose')
    flag.textContent = '🏁'
    flag.dataset.tip = 'Close this release on GitHub, in every repo'
    flag.onclick = e => { e.stopPropagation(); askClose(r) }
    wrap.appendChild(flag)
  }
  wrap.appendChild(open)
  return wrap
}
function shading(from, to) {
  const bg = []
  const d = new Date(from + 'T00:00:00Z')
  const end = new Date(to + 'T00:00:00Z')
  while (d <= end) {
    const iso = d.toISOString().slice(0,10)
    const dow = d.getUTCDay()
    const holiday = HOLIDAYS.has(iso)
    if (holiday || dow === 0 || dow === 6) {
      const next = new Date(d); next.setUTCDate(next.getUTCDate() + 1)
      bg.push({ id:'bg-' + iso, start:bkk(iso), end:bkk(next.toISOString().slice(0,10)), type:'background',
                className: holiday ? 'holiday' : 'off',
                title: holiday ? 'Thai public holiday' : 'weekend' })
    }
    d.setUTCDate(d.getUTCDate() + 1)
  }
  return bg
}

const plus = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n)
                         return x.toISOString().slice(0,10) }
let groups = null, firstDraw = true, shownCache = [], resize = null, downAt = { x:0, y:0 }

// dragging the due date handle: the bar follows the pointer, and letting go opens the confirm bar
document.addEventListener('pointermove', e => {
  if (!resize || !timeline) return
  const t = timeline.getEventProperties(e).time
  if (!t) return
  const min = resize.row.barStart                      // a bar never ends before it starts
  const d = toDay(t)
  resize.day = d < min ? min : d
  items.update({ id: resize.id, end: bkk(plus(resize.day, 1)) })
})
const endResize = () => {
  if (!resize) return
  const done = resize
  resize = null
  $('tl').classList.remove('edge')
  if (done.day) askConfirm(done.row, done.day)
}
document.addEventListener('pointerup', endResize)
document.addEventListener('pointercancel', endResize)

// vis hands back an instant; the day it belongs to is the Bangkok day the pointer is inside,
// not the nearest line, because the day under the pointer is the day the bar is covering
const toDay = d => new Date(Math.floor((+d + TZ_MS) / 864e5) * 864e5).toISOString().slice(0,10)

function drawTimeline(rows) {
  const shown = rows.filter(inWindow)
  // Read top to bottom: what is already closed, then the sprint being worked on now, then
  // everything queued behind it. Sorted by date alone an unticked release with an earlier due
  // date lands in the middle of the sprint, which is the one thing being read here. The sort is
  // stable, so inside each band the date order is untouched, and nothing moves until a tick.
  const band = r => r.state === 'closed' ? 0 : r.inSprint ? 1 : 2
  if (shown.some(r => r.inSprint)) shown.sort((a, b) => band(a) - band(b))
  shownCache = shown
  if (!shown.length) { $('tl').textContent = 'Nothing to show.'; return }
  // while a search is typed the search is the focus, not the sprint
  $('tl').classList.toggle('sprint-focus', !searchQ && shown.some(r => r.inSprint))
  $('tl').classList.toggle('search-focus', !!searchQ)
  const lo = shown.reduce((m, r) => r.barStart < m ? r.barStart : m, shown[0].barStart)
  const hi = shown.reduce((m, r) => r.barEnd > m ? r.barEnd : m, shown[0].barEnd)

  // one group per release, so every release keeps a row of its own
  const groupData = shown.map((r, i) => ({
    id: i, order: i, className: 'g-' + r.state + (r.inSprint ? ' g-sprint' : ''),
    content: labelEl(r)
  }))
  const data = shown.map((r, i) => ({
    id: i, group: i,
    content: blocksEl(r, i),
    start: bkk(r.barStart),
    // The end day is INSIDE the bar. Ending it at the due date drew a bar that stopped at the
    // line where the due day starts, so a release due on the 19th looked like it ended on the
    // 18th. It now runs to the start of the next day, which is the same rule the sprint pane
    // has always used, and a one day release is one column wide instead of nothing.
    end: bkk(plus(r.barEnd, 1)),
    className: 'st-' + r.state + (r.state === 'closed' ? '' : ' can-drag')
      + (r.inSprint ? ' in-sprint' : '') + (r.planned ? ' planned' : '')
      + (searchQ && rowMatch(r) ? ' has-hit' : ''),
    url: PROJECT_SLICE + encodeURIComponent(r.title)
  })).concat(shading(lo, plus(hi, 14)))   // background bands carry no group, so they span every row

  if (!timeline) {
    $('tl').textContent = ''                  // drop the skeleton before vis builds its DOM
    items = new vis.DataSet(data)
    groups = new vis.DataSet(groupData)
    timeline = new vis.Timeline($('tl'), items, groups, {
      stack: false,
      // Built WITH the opening window. Without start and end of its own, vis fits every item on
      // screen once its data lands, which happens after construction and quietly threw away the
      // window set here.
      ...futureWindow(shown, DEFAULT_ZOOM),
      horizontalScroll: false, verticalScroll: true,
      zoomKey: 'ctrlKey', zoomMin: 3 * 864e5, zoomMax: 800 * 864e5,
      // vis item editing is off on purpose: dragging anywhere then pans the view like a hand
      // tool, and the due date is moved by our own handle on the right edge instead
      // item orientation MUST be 'top' too: with the default (bottom), vis anchors the view
      // to the bottom edge and compensates every redraw with scrollTop += the change in
      // content height. Each font load, resize or refresh nudged the chart further down until
      // every row sat above the viewport and the panel showed nothing but white.
      moveable: true, selectable: false, editable: false, orientation: { axis:'top', item:'top' },
      // the axis, the grid and the today line are all drawn on Bangkok days
      moment: d => vis.moment(d).utcOffset(TZ_OFF),
      margin: { item: { horizontal: 0, vertical: 2 }, axis: 4 },
      showCurrentTime: true, maxHeight: '72vh', groupOrder: 'order',
      format: {
        minorLabels: { day:'ddd D', weekday:'ddd D', week:'D', month:'MMM' },
        majorLabels: { day:'MMMM YYYY', weekday:'MMMM YYYY', week:'MMMM YYYY', month:'YYYY' }
      }
    })
    timeline.on('rangechanged', tuneAxis)
    timeline.on('rangechange', placeSprint)     // track it live while panning and zooming
    timeline.on('changed', placeSprint)
    timeline.on('changed', dressAxis)
    timeline.on('changed', fitBars)
    addEventListener('resize', () => { lastSprintW = -1; placeSprint() })
    // vis measures the panel once, on construction. If the web font is still arriving, or the
    // container is laid out a frame later, it measures nothing and draws an empty chart that
    // nothing wakes up again. Redraw whenever the box changes size, and once the font lands.
    if (window.ResizeObserver) {
      let lastW = 0
      new ResizeObserver(() => {
        const w = $('tl').clientWidth
        if (w === lastW) return
        lastW = w
        if (timeline) { timeline.redraw(); lastSprintW = -1; placeSprint() }
      }).observe($('tl'))
    }
    // the label is measured, so it has to be measured again once the real font is in
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        if (timeline) timeline.redraw()
        lastSprintW = -1; placeSprint()
      })
    }

    // the last few pixels of a bar are the due date handle; everywhere else belongs to the hand tool
    const EDGE = 9
    const itemAt = t => {
      const el = t && t.closest && t.closest('.vis-item')
      const h = el && el.querySelector('[data-id]')
      return h ? { el, id: +h.dataset.id, row: shownCache[+h.dataset.id] } : null
    }
    const onEdge = (hit, x) => !!hit && !!hit.row && hit.row.state !== 'closed'
      && x >= hit.el.getBoundingClientRect().right - EDGE

    // vis drives its panning from pointerdown, so the handle has to claim that same event
    // in the capture phase. preventDefault is left out on purpose: it would kill the
    // pointermove events the drag needs.
    $('tl').addEventListener('pointerdown', e => {
      downAt = { x:e.clientX, y:e.clientY }
      const hit = itemAt(e.target)
      if (!onEdge(hit, e.clientX)) { $('tl').classList.add('grabbing'); return }
      e.stopPropagation()                                 // hold the hand tool back
      resize = { id: hit.id, row: hit.row, day: null }
    }, true)
    document.addEventListener('pointerup', () => $('tl').classList.remove('grabbing'))
    $('tl').addEventListener('pointermove', e => {
      if (!resize) $('tl').classList.toggle('edge', onEdge(itemAt(e.target), e.clientX))
    })
    // the row under the pointer lights up, label and lane as one, so the eye can check the
    // release name before a drag ever starts
    let litAt = null
    const litRow = i => {
      if (i === litAt) return
      litAt = i
      $('tl').querySelectorAll('.rowlit').forEach(el => el.classList.remove('rowlit'))
      if (i == null) return
      const lab = $('tl').querySelectorAll('.vis-labelset .vis-label')[i]
      const grp = $('tl').querySelectorAll('.vis-foreground .vis-group')[i]
      if (lab) lab.classList.add('rowlit')
      if (grp) grp.classList.add('rowlit')
    }
    $('tl').addEventListener('mouseleave', () => litRow(null))

    // a vertical line that follows the pointer with the date written on it
    timeline.addCustomTime(new Date(), 'cursor')
    timeline.on('mouseMove', props => {
      litRow(typeof props.group === 'number' ? props.group : null)
      if (!props.time) return
      timeline.setCustomTime(props.time, 'cursor')
      timeline.setCustomTimeMarker(props.time.toLocaleDateString('en-GB',
        { weekday:'short', day:'numeric', month:'short', timeZone:TZ }), 'cursor', false)
      $('dateNow').textContent = props.time.toLocaleDateString('en-GB',
        { weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:TZ })
    })

    $('tl').addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey) {
        // A trackpad pinch arrives as ctrl+wheel, one event a frame. vis turns each one
        // straight into zoom, which overshoots before the fingers have finished moving, so the
        // gesture is driven here instead: vis's own arithmetic, a third of the speed, still
        // anchored on the day under the pointer.
        e.preventDefault(); e.stopPropagation()
        const delta = (e.wheelDelta ? e.wheelDelta / 120 : -e.deltaY / 3) / PINCH_SLOW
        if (!delta) return
        const scale = delta < 0 ? 1 - delta / 5 : 1 / (1 + delta / 5)
        const t = timeline.getEventProperties(e).time
        timeline.range.zoom(scale, t ? t.valueOf() : null)
        return
      }
      // sideways: a trackpad swipe or shift+wheel moves along the timeline
      const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX
               : e.shiftKey ? e.deltaY : 0
      if (dx) {
        e.preventDefault(); e.stopPropagation()
        const w = timeline.getWindow()
        const step = (w.end - w.start) * (dx / $('tl').clientWidth)
        timeline.setWindow(new Date(+w.start + step), new Date(+w.end + step), { animation:false })
        return
      }
      // up and down: vis only listens on the name column, so drive its scroller ourselves
      const box = timeline.dom && timeline.dom.left && timeline.dom.left.parentNode
      if (!box) return
      const was = box.scrollTop
      box.scrollTop = was + e.deltaY
      if (box.scrollTop !== was) { e.preventDefault(); e.stopPropagation() }
    }, { passive:false, capture:true })
  } else {
    items.clear(); items.add(data)
    groups.clear(); groups.add(groupData)
  }
  // open on the whole road ahead: a week before today, out to the last future release
  if (firstDraw) {
    firstDraw = false
    showFuture(shown, DEFAULT_ZOOM)
    // and at the top row. Belt and braces after the bottom-anchor bug: whatever state the
    // vertical scroll is in after the first build, the first thing shown is the first release.
    const box = timeline.dom.left.parentNode
    if (box) box.scrollTop = 0
    // The chart can come up white with everything in place but nothing painted, and any
    // interaction cures it: a scroll on the chart, a browser zoom. A redraw alone did not, so
    // this replays the user's own cure, a 1px scroll nudge plus a compositing poke, after the
    // first frame, again shortly after (the axis rescale and the sprint pane land late), once
    // the font is in, and whenever the tab becomes visible. All invisible on a healthy chart.
    const poke = () => {
      if (!timeline) return
      timeline.redraw()
      const b = timeline.dom.left.parentNode
      if (b) { b.scrollTop += 1; b.scrollTop -= 1 }
      $('tl').style.transform = 'translateZ(0)'
      requestAnimationFrame(() => { $('tl').style.transform = '' })
    }
    requestAnimationFrame(poke)
    setTimeout(poke, 700)
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setTimeout(poke, 0))
    document.addEventListener('visibilitychange', () => { if (!document.hidden) poke() })
  }
  tuneAxis(); placeSprint()
  $('older').title = 'Showing releases closed in the last ' + windowDays + ' days. Load further back.'
}

// vis escapes any HTML in an axis label, so the two line day label, weekday over number, is
// dressed after the fact: the label arrives as "Tue 18" and is split into a small weekday and
// the number. vis rewrites the labels on every repaint, so this runs on every 'changed'.
function dressAxis() {
  for (const el of $('tl').querySelectorAll(
      '.vis-time-axis .vis-text.vis-minor:not(.vis-measure)')) {
    const m = el.firstChild && el.firstChild.nodeType === 3
      && el.textContent.match(/^([A-Za-z]{3}) (\d+)$/)
    if (!m) continue
    el.textContent = ''
    const d = elem('span', 'dow'); d.textContent = m[1]
    el.append(d, document.createTextNode(m[2]))
  }
}

// Every day gets its own grid line while there is room to print the number. Only when the
// window is very wide do the lines drop back to one a week, then one a month.
let axisScale = null
// The strip spans the full bar, clipped or not: what the window cannot hold stays off
// screen. Only the seams adapt: under 4px a card they eat the colour, so the strip goes
// dense. The full count is always one hover away on the bar tooltip.
function fitBars() {
  for (const w of document.querySelectorAll('#tl .blocks'))
    w.classList.toggle('dense', w.clientWidth / Math.max(1, w.childElementCount) < 4)
}

function tuneAxis() {
  if (!timeline) return
  const w = timeline.getWindow()
  const px = ($('tl').clientWidth - 440) / ((w.end - w.start) / 864e5)   // pixels per day
  const want = px >= 13 ? 'day' : px >= 2.6 ? 'week' : 'month'
  if (want === axisScale) return
  axisScale = want
  timeline.setOptions({ timeAxis: { scale: want, step: 1 } })
}

/* ---- sprint pane: a frosted block laid over the chart between two dates ---- */
let sprint = null
try { sprint = JSON.parse(localStorage.getItem('sprint') || 'null') } catch (e) { sprint = null }
let sprintEl = null, lastSprintW = -1

function placeSprint() {
  if (!timeline) return
  if (!sprintEl) {
    sprintEl = elem('div'); sprintEl.id = 'sprint'
    sprintEl.appendChild(elem('b'))
    timeline.dom.center.parentNode.appendChild(sprintEl)   // the visible time window
  }
  if (!sprint || !sprint.from || !sprint.to) { sprintEl.style.display = 'none'; return }
  const w = timeline.getWindow()
  const box = timeline.dom.center.parentNode.getBoundingClientRect()
  const at = d => (bkk(d) - w.start) / (w.end - w.start) * box.width
  const x1 = at(sprint.from), x2 = at(plus(sprint.to, 1))   // the end day is included
  if (x2 < 0 || x1 > box.width) { sprintEl.style.display = 'none'; return }
  sprintEl.style.display = 'block'
  const left = Math.max(-2, x1)
  const paneW = Math.max(2, Math.min(box.width + 2, x2) - left)
  sprintEl.style.left = left + 'px'
  sprintEl.style.width = paneW + 'px'

  // The pane clips its contents, so a label wider than the pane loses characters off BOTH
  // ends and reads as nonsense. Step the label down until it fits, and drop it entirely on a
  // very narrow sprint. Only recomputed when the width actually changes, so panning stays cheap.
  if (Math.round(paneW) === lastSprintW) return
  lastSprintW = Math.round(paneW)
  const days = Math.round((new Date(sprint.to) - new Date(sprint.from)) / 864e5) + 1
  const lab = sprintEl.firstChild
  const options = ['Sprint · ' + pretty(sprint.from) + ' to ' + pretty(sprint.to) + ' · ' + days + 'd',
                   'Sprint · ' + days + 'd', 'Sprint', '']
  for (const text of options) {
    if (!text) { lab.style.display = 'none'; break }
    lab.style.display = ''
    lab.textContent = text
    if (lab.offsetWidth <= paneW - 8) break
  }
}

function saveSprint(v) {
  sprint = v
  lastSprintW = -1                       // new dates, so the label has to be measured again
  if (v) localStorage.setItem('sprint', JSON.stringify(v)); else localStorage.removeItem('sprint')
  placeSprint()
  // unticked releases queue up after the sprint, so moving it moves them
  if (rowsCache.length) { applyPlan(rowsCache); drawTable(); drawTimeline(rowsCache) }
}
// dd/mm/yyyy in, ISO out. Month and year are optional and fall back to this month and this
// year, so a sprint inside the current month only needs the day typed.
function parseDMY(s) {
  const m = String(s).trim().match(/^(\d{1,2})(?:\s*[\/\-. ]\s*(\d{1,2})(?:\s*[\/\-. ]\s*(\d{2,4}))?)?$/)
  if (!m) return null
  const now = new Date()
  const d = +m[1]
  const mo = m[2] ? +m[2] : now.getMonth() + 1
  let y = m[3] ? +m[3] : now.getFullYear()
  if (y < 100) y += 2000
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null
  const iso = y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0')
  const chk = new Date(iso + 'T00:00:00Z')
  return isNaN(chk) || chk.getUTCDate() !== d ? null : iso     // rejects 31/02
}
const toDMY = iso => iso ? iso.slice(8) + '/' + iso.slice(5,7) + '/' + iso.slice(0,4) : ''

$('sprintBtn').onclick = () => {
  const on = $('sprintBox').hidden
  $('sprintBox').hidden = !on
  if (!on) return
  const today = todayISO()
  // pre-filled with today and a two week sprint, so usually only the day needs changing
  $('sprintFrom').value = toDMY(sprint ? sprint.from : today)
  $('sprintTo').value   = toDMY(sprint ? sprint.to : plus(today, 13))
  $('sprintFrom').focus(); $('sprintFrom').select()
}
$('sprintSave').onclick = () => {
  const from = parseDMY($('sprintFrom').value), to = parseDMY($('sprintTo').value)
  $('sprintFrom').classList.toggle('bad', !from)
  $('sprintTo').classList.toggle('bad', !to || (!!from && to < from))
  if (!from || !to || to < from) return
  saveSprint({ from, to })
  $('sprintBox').hidden = true
}
$('sprintTo').onkeydown = $('sprintFrom').onkeydown = e => {
  if (e.key === 'Enter') $('sprintSave').click()
  if (e.key === 'Escape') $('sprintBox').hidden = true
}
$('sprintClear').onclick = () => {
  saveSprint(null)
  $('sprintBox').hidden = true
}

// The zoom buttons step by 0.4, and vis divides the window by 1 + that, so three clicks in is
// 1.4^3. The window is cut from the far end only, so today stays where the Fit view puts it,
// and the floor in futureWindow keeps at least a week on screen however far ahead the last
// release is.
const DEFAULT_ZOOM = Math.pow(1.4, 3)
// how much slower a pinch zooms than vis does it on its own
const PINCH_SLOW = 6
// A week back, out to the last future release, optionally cut to `zoom` of that span.
function futureWindow(rows, zoom) {
  const today = todayISO()
  const hi = rows.reduce((m, r) => r.barEnd > m ? r.barEnd : m, today)
  const from = plus(today, -7), to = plus(hi, 7)
  const days = Math.round((new Date(to) - new Date(from)) / 864e5)
  return { start: bkk(from),
           end: bkk(zoom ? plus(from, Math.max(7, Math.round(days / zoom))) : to) }
}
function showFuture(shown, zoom) {
  const rows = shown || rowsCache.filter(inWindow)
  if (!timeline || !rows.length) return
  const w = futureWindow(rows, zoom)
  timeline.setWindow(w.start, w.end, { animation:false })
}

/* ---- notes: the pile before the plan ----------------------------------------------
   A note is what a card is before anyone has decided it is work: an idea, a requirement
   somebody said out loud, a thing not to forget. Writing one costs a sentence.

   They live in this browser first, so typing never waits for the network, and are pushed to
   one GitHub issue a couple of seconds later so a cleared cache, a second laptop or a phone
   sees the same pile. Two writers are reconciled per note by updatedAt, and a deleted note
   leaves a tombstone, or a stale tab would resurrect it on its next push. */
const NOTES_REPO = 'zai-backend'
const NOTES_TITLE = '📝 Release Planner notes'
const NOTES_MARK = '<!-- release-planner-notes v1 -->'
const NOTE_TYPES = ['no type', 'Story', 'Task', 'Bug', 'Defect', 'Epic']

let notes = []
try { notes = JSON.parse(localStorage.getItem('plannerNotes') || '[]') } catch (e) { notes = [] }
let notesIssue = null                    // the issue number the pile is stored in
let notesPush = null, notesBusy = false, notesDirty = false

const noteId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7)
const liveNotes = () => notes.filter(n => !n.deleted)
const noteTitle = n => (n.text || '').split('\n')[0].trim()
const noteRest = n => (n.text || '').split('\n').slice(1).join('\n').trim()

// newest wins per note, and a tombstone beats an edit of the same age
function mergeNotes(mine, theirs) {
  const by = new Map()
  for (const n of [...theirs, ...mine]) {
    const had = by.get(n.id)
    if (!had || (n.updatedAt || 0) > (had.updatedAt || 0)
        || ((n.updatedAt || 0) === (had.updatedAt || 0) && n.deleted)) by.set(n.id, n)
  }
  // a tombstone is only worth keeping while a stale tab could still be holding the note
  const cutoff = Date.now() - 30 * 864e5
  return [...by.values()].filter(n => !n.deleted || (n.updatedAt || 0) > cutoff)
                         .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
}

function saveNotes(push = true) {
  localStorage.setItem('plannerNotes', JSON.stringify(notes))
  drawNotes()
  drawTable()
  if (timeline) drawTimeline(rowsCache)
  if (!push) return
  notesDirty = true
  clearTimeout(notesPush)
  notesPush = setTimeout(syncNotes, 2000)          // typing must never wait on GitHub
}

function noteSyncSays(text, bad) {
  const el = $('noteSync')
  el.textContent = text
  el.className = bad ? 'err' : 'muted'
}

// the issue that holds the pile, found by title so any browser can pick it up, made on demand
async function notesIssueNumber() {
  if (notesIssue) return notesIssue
  const q = 'repo:' + OWNER + '/' + NOTES_REPO + ' in:title "' + NOTES_TITLE + '"'
  const res = await fetch('https://api.github.com/search/issues?q=' + encodeURIComponent(q),
    { cache:'no-store', headers:{ 'Authorization':'Bearer ' + token(),
                                  'Accept':'application/vnd.github+json' } })
  const j = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error('looking for the notes issue: HTTP ' + res.status
    + (j.message ? ' ' + j.message : ''))
  const hit = (j.items || []).find(i => i.title === NOTES_TITLE)
  if (hit) return (notesIssue = hit.number)
  const made = await fetch('https://api.github.com/repos/' + OWNER + '/' + NOTES_REPO + '/issues', {
    method:'POST',
    headers:{ 'Authorization':'Bearer ' + token(), 'Accept':'application/vnd.github+json',
              'Content-Type':'application/json' },
    body: JSON.stringify({ title: NOTES_TITLE, body: notesBody([]) })
  })
  const mj = await made.json().catch(() => ({}))
  if (!made.ok) throw new Error('making the notes issue: HTTP ' + made.status
    + (mj.message ? ' ' + mj.message : ''))
  return (notesIssue = mj.number)
}

// the issue body: readable for anyone who opens it, with the data in a fenced block
function notesBody(list) {
  const live = list.filter(n => !n.deleted)
  return NOTES_MARK + '\n\n**Pre-plan notes from the Release Planner.** Edited by the page, not '
    + 'by hand: anything typed here is overwritten on the next sync.\n\n'
    + (live.length ? live.map(n => '- ' + (n.ms ? '**[' + cleanTitle(n.ms) + ']** ' : '')
        + noteTitle(n) + (isArch(n) ? ' _(archived)_' : '')).join('\n') : '_No notes._')
    + '\n\n```json\n' + JSON.stringify(list, null, 1) + '\n```\n'
}

const notesFromBody = body => {
  const m = (body || '').match(/```json\n([\s\S]*?)\n```/)
  if (!m) return []
  try { return JSON.parse(m[1]) } catch (e) { return [] }
}

async function syncNotes(quiet) {
  if (!token() || notesBusy) return
  notesBusy = true
  try {
    noteSyncSays('syncing...')
    const num = await notesIssueNumber()
    const url = 'https://api.github.com/repos/' + OWNER + '/' + NOTES_REPO + '/issues/' + num
    const res = await fetch(url, { cache:'no-store',
      headers:{ 'Authorization':'Bearer ' + token(), 'Accept':'application/vnd.github+json' } })
    const j = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error('reading the notes issue: HTTP ' + res.status)
    const merged = mergeNotes(notes, notesFromBody(j.body))
